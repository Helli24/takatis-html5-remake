  else if(s[2]===-4){e.seg=0;s=e.path[0];e.x=660;e.y=200-PY;e.dx=s[0];e.dy=s[1];e.cnt=(e.path[1]||s)[2];return;}
  e.dx=s[0];e.dy=s[1];e.cnt=s[2];}
// ---------- effects: particles (list 0x491c20) and explosions (list 0x494078), both as in the original.
// Positions are screen x and playfield y (screen y - 16) like everything else in the remake.
const R=n=>Math.floor(Math.random()*32768)%n;   // rand()%n; rand() of the C runtime returns 0..32767
const OPT={smoke:false};   // option 0x4966b4 (smoke behind Debris1 particles), off in the shipped Options.ini
// particle constructor (0x402cf0): types 0..2 are debris with a random speed of -5..5 and gravity (0: Debris1-5,
// 1: Debris3-5, 2: Debris3/4), 3/9 smoke, 4 laser smoke, 5 shield flare (these three stand still and keep the given
// position, all others are moved by +25/+25), 6/7 Debris3 thrown up to the right/left, 8 engine exhaust.
// Every sheet holds 4x4 frames of 16x16.
const PSPR=['debris1','debris2','debris3','debris4','debris5','smoke','lasersmoke','shieldflare','drive'];
let PART=[];   // oldest first; the original list keeps the newest first
function particle(x,y,type){const p={vx:0,vy:0,spr:0,col:0,row:0,tick:0,grav:0,x:x+25,y:y+25,draw:null};
  while(p.vx===0&&p.vy===0){p.vx=R(11)-5;p.vy=R(11)-5;}
  if(type===0)p.spr=R(5);
  else if(type===1){do p.spr=R(5);while(p.spr<2);}
  else if(type===2){do p.spr=R(4);while(p.spr<2);}
  else if(type===6||type===7){p.spr=2;p.vx=(R(7)+1)*(type===6?1:-1);p.vy=-R(7);}
  else if(type===8){p.spr=8;let v=0;while(!v)v=R(3);p.vx=-v-(P.spd||3);p.vy=0;}
  else if(type===3||type===9||type===4||type===5){p.spr=type===4?6:type===5?7:5;p.x=x;p.y=y;}
  PART.push(p);}
// update (0x403070): drawn at the old position, then moved; 3 ticks per frame (2 for the exhaust); frames 0..14 run,
// then Debris1/2/4/5 start over while all others vanish; gravity adds 1 to vy every 6 frames (not for the exhaust)
function partUpdate(p){
  if(p.spr===0&&OPT.smoke&&R(2)===1)particle(p.x,p.y,9);
  p.draw={sx:p.col*16,sy:p.row*16,x:p.x,y:p.y};
  if(p.spr<5||p.spr>7){p.x+=p.vx;p.y+=p.vy;}
  if(++p.tick===(p.spr===8?2:3)){if(++p.col===4){p.col=0;p.row++;}
    if(p.row===3&&p.col===3){p.col=0;p.row=0;if(p.spr===2||p.spr>=5)p.x=-1000;}p.tick=0;}
  if(p.grav===6&&p.spr!==8){p.vy++;p.grav=0;}p.grav++;}
// list update (0x4035b0): after each particle the next one is dropped when it is more than 16 px outside the
// playfield; the newest particle is never checked. Particles made during the update wait for the next frame.
const PB={top:16,bottom:433};   // 0x485690/0x485694: the playfield, the whole screen during the credits
function partStep(){const L=PART,n=L.length,keep=[],y0=PB.top-16-PY,y1=PB.bottom+16-PY;
  for(let i=n-1;i>=0;i--){partUpdate(L[i]);keep.push(L[i]);
    if(i>0){const q=L[i-1];if(q.x<-16||q.x>W+16||q.y<y0||q.y>y1)i--;}}
  PART=keep.reverse().concat(L.slice(n));}
function partDraw(){for(let i=PART.length-1;i>=0;i--){const p=PART[i],d=p.draw;if(d)ctx.drawImage(S[PSPR[p.spr]].img,d.sx,d.sy,16,16,d.x,d.y,16,16);}}

// explosions (constructor 0x40d860, update 0x40da90, list 0x40dfa0). Type 0 is one of the two big explosions and
// brings the explosion sound (not while the ship or the boss is dying) and a smoke particle, 1 is the beam explosion,
// 2 the small one. A delay holds the explosion back; it does not scroll meanwhile. BltFast has no clipper: only the
// left edge is clipped, a frame that sticks out anywhere else is not drawn at all.
let EXPL=[];
const EXPL_T={0:[8,4,7,'explosion',60,50],5:[6,3,5,'explosion2',48,48],1:[5,5,5,'beamexplode',50,50],2:[6,3,5,'smallexpl',16,16]};
function explosion(x,y,delay,type){let t=type;
  if(type===0){if(R(2)!==1)t=5;if(!P.dead&&!bossDying())sfx('explosion');particle(x,y,3);}
  const [n,cols,tpf,spr,w,h]=EXPL_T[t];EXPL.push({x,y,delay,n,cols,tpf,spr,w,h,f:0,tick:0,done:false,draw:null});}
function explStep(){for(const e of EXPL){e.draw=null;if(e.delay>0){e.delay--;continue;}
    const fd=e.f,sx=(fd<e.cols?fd:fd-e.cols)*e.w,sy=fd<e.cols?0:e.h;
    if(++e.tick===e.tpf){e.f++;e.tick=0;}
    if(fd<e.n){const cut=e.x<0?-e.x:0;if(e.w-cut>0&&e.x+e.w<=W&&e.y+PY>=0&&e.y+PY+e.h<=H)e.draw={sx:sx+cut,sy,x:e.x+cut,w:e.w-cut,y:e.y};}
    if(e.f===e.n)e.done=true;
    e.x-=G.speed;}
  if(EXPL.length&&EXPL[0].done)EXPL.shift();}   // only the oldest one leaves the list, one per frame
function explDraw(){for(const e of EXPL){const d=e.draw;if(d)ctx.drawImage(S[e.spr].img,d.sx,d.sy,d.w,e.h,d.x,d.y,d.w,e.h);}}
// the staggered explosion of a destroyed enemy or ship: 5 explosions 5 frames apart around (x,y)
function explode5(x,y,type){for(let i=0;i<25;i+=5){const dx=R(21)-10,dy=R(51)-25;explosion(x+dx,y+dy,i,type);if(type===2)sfx('hit');}}
// ---------- shots (list 0x492540): the ship's shots, the enemy shots and the items share one list, one update and
// one draw pass. Constructor 0x40f3d0, update and draw 0x40fe10, collisions 0x41e570, walls in the tile pass 0x42c1d0.
// Types: 0 spread, 1-4 beam stages, 5 powerline, 7 laser, 8/9/10 bounce big/medium/small, 11 rocket; enemy side:
// 6 blob, 12-18 items (rocket, powerline, shield, spread, laser, bounce, 1up), 19 bullet, 20 walker shot, 21 bull
// spread, 22 chase shot, 23 mine, 24 elevator shot, 25/26 spikes, 27 enemy powerline, 28 volcano ball.
// Per type: sprite, frame width, height of the source rectangle, enemy side, frame given by the constructor.
const SHOT_T=[['spread',18,17,0,1],['beammini',16,8,0,1],['beamsmall',32,16,0,1],['beammed',48,24,0,1],['beambig',64,32,0,1],
  ['powerline',16,31,0,0],['blob',12,12,1,0],['laser',24,12,0,0],['bounce1',24,24,0,0],['bounce2',18,18,0,0],['bounce3',12,12,0,0],
  ['rocket',16,16,0,0],['pu_rocket',20,20,1,0],['pu_line',20,20,1,0],['pu_shield',20,20,1,0],['pu_spread',20,20,1,0],
  ['pu_laser',20,20,1,0],['pu_bounce',20,20,1,0],['pu_oneup',20,20,1,0],['bullet',8,8,1,0],['walkershot',24,24,1,0],
  ['bullspread',18,13,1,1],['chaseshot',32,14,1,1],['mine',24,24,1,1],['elevatorshot',32,8,1,1],['spike1',16,17,1,1],
  ['spike2',16,17,1,1],['powerline',16,31,1,1],['volcanoball',16,16,1,1]];
const ESHOT_TYPE={blob:6,bullet:19,walkershot:20,bullspread:21,chaseshot:22,mine:23,elevatorshot:24,spike1:25,spike2:26,powerline:27,volcanoball:28};
// x, y = playfield position; rl/rr/rb = source rectangle (left, right, bottom; the top is always 0). The ship-shot
// collision uses rr and rb as width and height, which makes frames further right hit wider (as in the original).
function shotNew(x,y,vx,vy,type,frame=0,dmg=0,b22=0){const T=SHOT_T[type],fw=T[1];
  const s={type,x,y,vx,vy,dmg,b22,spr:T[0],fw,rl:T[4]?frame*fw:0,rr:T[4]?frame*fw+fw:fw,rb:T[2],own:T[3],act:true,
    t10:0,off:0,tgt:null,tr:0,lf:0,lv:0,g60:0,carrier:null,draw:null};
  G.shots.push(s);return s;}
function eshot(x,y,vx,vy,spr,opt={}){return shotNew(x,y,vx,vy,ESHOT_TYPE[spr],opt.frame||0,10);}

// ---------- weapons (player update 0x41ced0)
// every value below is read from Takatis.exe; frame counts assume the original 75 fps
const LASER_CD=[24,18,12,6],LASER_DMG=[5,4,3,3];
function fireSpread(){const lv=P.lvl[0],sp=(dx,vx,vy,fr)=>shotNew(P.x+dx,P.y+20,vx,vy,0,fr,3);
  sp(35,8,0,0);
  if(lv>=2){const dx=lv===4?47:45;sp(dx,7,-1,1);sp(dx,7,1,2);}
  if(lv>=3){sp(50,6,-2,3);sp(50,6,2,4);}
  if(lv>=4){sp(53,5,-3,5);sp(53,5,3,6);}
  sfx('spread');P.cool=20;}
function fireLaser(){const lv=P.lvl[1];   // two shots, each on its own half of the sine wave
  for(const v of [0,1])shotNew(P.x+38,P.y+21,5,0,7,0,LASER_DMG[lv-1],v);
  sfx('laser');P.cool=LASER_CD[lv-1];}
const F32=Math.fround,F02=Math.fround(0.2);
// laser (0x40fea0): smoke every 5 frames, then the sine offset in float32 arithmetic exactly as in the original
function laserStep(s){const sg=s.b22?-1:1;
  if(s.tr===0&&s.act){particle(s.x,s.y+s.off,4);s.tr=5;}s.tr--;
  if(s.off*sg>=30){s.lf=0;s.lv=-s.lv;}if(s.off*sg<=0){s.lf=1;s.lv=1;}
  s.off+=(s.lf?2:-2)*sg;s.lv=F32(s.lv-F02);s.off+=Math.trunc(s.lv)*sg;}
function fireBounce(){const lv=P.lvl[2];
  shotNew(P.x+40,P.y+17,9,0,8,0,4);
  if(lv===4){shotNew(P.x+40,P.y+17,8,-3,10,0,3);shotNew(P.x+40,P.y+17,8,3,10,0,3);}
  sfx('bounce');P.cool=lv<4?30:20;}
function fireRocket(){P.rockets--;const s=shotNew(P.x+30,P.y+20,6,0,11,0,100);s.rl=32;s.rr=48;sfx('rocket');}
function fireLine(){P.lines--;for(let y=0;y<=384;y+=32)shotNew(P.x+50,y,15,0,5,0,8);   // 13 segments over the whole height
  sfx('powerline');}
function releaseBeam(){const c=P.beam;P.beam=0;   // charge 0..248; exactly 110 and 180 fire nothing, as in the original
  const lv=c>40&&c<110?1:c>110&&c<180?2:c>180&&c<248?3:c===248?4:0;if(!lv)return;
  const B=[[34,25,10],[35,20,15],[35,16,20],[35,11,25]][lv-1];
  shotNew(P.x+B[0],P.y+B[1],8,0,lv,0,B[2]);sfx('beam');}
// bounce balls hitting an enemy or the boss (0x41efa4, 0x41e6ab): the big ball splits into two medium ones going back
// (not at stage 1), a medium ball moving left splits into two small ones depending on the face it hit (not at stage 2).
// b = the box that was hit.
function bounceSplit(s,b){const lv=P.lvl[2];
  if(s.type===8&&lv!==1)for(const vy of [9,-9])shotNew(s.x-9,s.y,-9,vy,9,0,5);
  if(s.type===9&&lv!==2&&s.vx<0){const right=b.x+b.w-s.x;let q;
    if(s.vy<0)q=b.y+b.h-s.y<=right?[[0,9,-9,9],[0,9,9,9]]:[[9,0,9,-9],[9,0,9,9]];
    else if(s.vy>0)q=s.rb-(b.y-s.y)<=right?[[0,-9,-9,-9],[0,-9,9,-9]]:[[9,0,9,-9],[9,0,9,9]];
    if(q)for(const [dx,dy,vx,vy] of q)shotNew(s.x+dx,s.y+dy,vx,vy,10,0,5);}}
// bounce balls hitting a wall (0x42c52c): big and medium balls split as above; a small ball (and a medium one at
// stage 2) reflects off the face it hit and dies in a corner. Returns true when the ball survives.
function bounceWall(s,b){const lv=P.lvl[2];
  if(s.type===8||(s.type===9&&lv!==2)){bounceSplit(s,b);return false;}
  let n=0,fa=false,fb=false;const right=b.x+b.w-1-s.x,left=s.fw-(b.x-s.x),below=b.y+b.h-1-s.y,above=s.rb-(b.y-s.y);
  if(s.vx<0&&s.vy<0){if(below<=right){s.vy=-s.vy;s.y+=11;fa=true;}else{s.vx=-s.vx;s.x+=11;}n++;}
  if(s.vx<0&&s.vy>0&&!fa){if(above<=right){s.vy=-s.vy;s.y-=11;}else{s.vx=-s.vx;s.x+=11;}n++;}
  if(s.vx>0&&s.vy<0){if(b.y+b.h-s.y<=left){s.vy=-s.vy;s.y+=11;fb=true;}else{s.vx=-s.vx;s.x-=11;}n++;}
  if(s.vx>0&&s.vy>0&&!fb){if(above<=left){s.vy=-s.vy;s.y-=11;}else{s.vx=-s.vx;s.x-=11;}n++;}
  return n<2;}
// rocket (0x41014e): smoke every 2 frames; without a target it flies straight and searches: every enemy that is
// neither targeted yet nor of type 0, 39 or 18..21 gets marked and the last one becomes the target, otherwise the
// last enemy that is not 0 or 39. It steers 6 px per axis, 1 px when closer than 6, and loses a target that is gone.
const ROCKET_FR=(vx,vy)=>vy<0?(vx>0?1:vx<0?7:0):vy>0?(vx>0?3:vx<0?5:4):(vx>0?2:vx<0?6:-1);
function rocketStep(s){
  if(s.tr===0&&s.act){particle(s.x,s.y+R(10)-5,3);s.tr=2;}s.tr--;
  if(!s.tgt){s.vx=6;s.vy=0;
    for(const e of G.enemies)if(!e.dead&&!e.rtarget&&e.type!==0&&e.type!==39&&!(e.type>=18&&e.type<=21)){e.rtarget=true;s.tgt=e;}
    if(!s.tgt)for(const e of G.enemies)if(!e.dead&&e.type!==39&&e.type!==0){e.rtarget=true;s.tgt=e;}}
  if(s.tgt&&!s.tgt.dead){const ax=d=>d>=6?6:d>0?1:d<=-6?-6:d<0?-1:0;s.vx=ax(s.tgt.x-s.x);s.vy=ax(s.tgt.y-s.y);}else s.tgt=null;
  const fr=ROCKET_FR(s.vx,s.vy);if(fr>=0){s.rl=fr*16;s.rr=fr*16+16;}}
// update and draw of one shot (0x40fe10): the shot is drawn at its old position (for the laser including the wave
// offset), then moved; the pixel tests of the collisions use that drawn position. Enemy shots and items drift with
// (speed-1); an item stays on its claw (+8/+42) and drifts 1 px per frame more once the claw is gone.
let VOLCANO_SAFE=false;   // 0x493ffc: "crazy volcanos" in the console, volcano balls become harmless
function shotStep(s){
  if(s.type===28&&s.g60===16){s.vy++;s.g60=0;}s.g60++;
  if(s.type===7)laserStep(s);
  if(s.type===28){if(s.tr===0&&s.act){particle(s.x+R(4)-2,s.y+R(4)-2,3);s.tr=3;}s.tr--;if(VOLCANO_SAFE)s.own=0;}
  if(s.type===11)rocketStep(s);
  s.draw=null;
  if(s.act){if(s.x>W+s.fw||s.y+s.rb<0||s.y>PH+1||s.x+s.fw<0)s.act=false;   // leaves the playfield (drawn a last time)
    let x=s.x,y=s.y+s.off,rl=s.rl,rr=s.rr,rb=s.rb,rt=0;   // clipped to the playfield like BltFast needs it
    if(x<0){rl-=x;x=0;}if(x+s.fw>W)rr-=x+s.fw-W;if(y<0){rt=-y;y=0;}if(y+s.rb>PH+1)rb=PH+1-y;
    if(rr>rl&&rb>rt)s.draw={x,y,sx:rl,sy:rt,w:rr-rl,h:rb-rt};}
  if(s.own)s.x-=G.speed-1;
  if(s.type>=12&&s.type<=18&&s.carrier){if(!s.carrier.dead){s.x=s.carrier.x+8;s.y=s.carrier.y+42;}else s.x-=1;}
  else{s.x+=s.vx;s.y+=s.vy;}
  if(s.type>=1&&s.type<=4){   // beams: two frames alternating every 6 frames, shield flares behind them
    if(++s.t10===6){if(s.rr===s.fw){s.rl=s.fw;s.rr=2*s.fw;}else{s.rl=0;s.rr=s.fw;}s.t10=0;}
    const on=s.t10%3!==0&&s.act;
    if(s.type===1&&on)particle(s.x,s.y-3,5);
    if(s.type===2&&on)particle(s.x,s.y+1,5);
    if(s.type===3){const d=R(6)-3;if(on)particle(s.x,s.y+d-1,5);particle(s.x,s.y+d+9,5);}
    if(s.type===4){const d=R(8)-4;if(on){particle(s.x+d+8,s.y+d+1,5);particle(s.x+d+8,s.y+d+16,5);particle(s.x+d,s.y+d+9,5);}}}
  if(s.type===23&&++s.t10===12){if(s.rr===s.fw){s.rl=s.fw;s.rr=2*s.fw;}else{s.rl=0;s.rr=s.fw;}s.t10=0;}}   // mines blink
// list update (0x410f30): newest shot first; switched-off shots leave the list
function shotsStep(){const n=G.shots.length;for(let i=n-1;i>=0;i--){const s=G.shots[i];if(s.act)shotStep(s);else s.draw=null;}
  G.shots=G.shots.filter(s=>s.act||s.draw);}
function shotsDraw(){for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i],d=s.draw;if(d)ctx.drawImage(S[s.spr].img,d.sx,d.sy,d.w,d.h,d.x,d.y,d.w,d.h);}}
// the shape a shot was drawn with, for the pixel tests
const shotShape=s=>{const d=s.draw;return d?{img:S[s.spr].img,sx:d.sx,sy:d.sy,w:d.w,h:d.h,x:d.x,y:d.y}:null;};
// ---------- pickups (0x41eace): no weapon switch, fixed points per item
function pickup(type){
  if(type===12){if(P.rockets<16)P.rockets++;G.score+=100;sfx('v_homing');}
  else if(type===13){if(P.lines<16)P.lines++;G.score+=200;sfx('v_line');}
  else if(type===14){P.shieldOn=true;P.shieldT=0;G.score+=500;sfx('v_shield');}
  else if(type>=15&&type<=17){const i=type-15;G.score+=1000;sfx(['v_spread','v_laser','v_bounce'][i]);if(P.lvl[i]<4)P.lvl[i]++;}
  else if(type===18){G.score+=2500;sfx('v_oneup');G.lives++;}}

// ---------- damage: 3 energy, death below 0; enemy shot -1, ramming -2; no invulnerability frames
function killPlayer(){if(!P.dead)P.dead=400;}   // the death sequence starts with the next frame (0x41c95b)
// destroyed enemy (ramming 0x40bd13, shot 0x41f247, wall 0x42cb59): 5 staggered explosions and debris
function enemyBlast(e,debris,dy=0){explode5(e.x,e.y,0);for(let k=0;k<debris;k++)particle(e.x,e.y+dy,0);}
// a ship shot hits enemy e (0x41ef05): energy, then either the destruction with points, drops and 25 debris or 1-4
// sparks with a hit sound each; the powerline and the biggest beam (except against type 0) fly on
function shotHitsEnemy(s,e){e.hp-=s.dmg;
  if(e.type===23){const dx=R(10)-5,dy=R(10)-5;for(let k=0;k<7;k++)particle(s.x+dx,s.y+dy,5);s.act=false;}
  if(s.type===8||s.type===9)bounceSplit(s,e);
  if(e.hp<=0){const small=e.type>=18&&e.type<=21;
    for(let i=0;i<25;i+=5){const dx=R(21)-10,dy=R(51)-25;   // the points are added once per step (0x41f45f)
      if(small){explosion(e.x+dx,e.y+dy,i,2);sfx('hit');}else explosion(e.x+dx,e.y+dy,i,0);
      if(e.type===28)for(const [vx,vy,t] of [[-3,-3,25],[3,3,25],[3,-3,26],[-3,3,26]])shotNew(e.x+28,e.y+28,vx,vy,t,0,10);
      G.score+=e.score;}
    if(!small)for(let k=0;k<25;k++)particle(e.x,e.y,0);
    if(e.type===6){shotNew(e.x+10,e.y+10,-1,0,12);shotNew(e.x-10,e.y+25,-1,0,12);shotNew(e.x+30,e.y+25,-1,0,12);}   // extra load of the claws
    if(e.type===7)shotNew(e.x+10,e.y+10,-1,0,13);
    if(!(e.type>=3&&e.type<=9)&&!small&&CON.xmas){const r=R(3);shotNew(e.x,e.y,-1,0,[14,12,13][r]);}   // "merry xmas" (0x41f793)
    else if(!(e.type>=3&&e.type<=9)&&!small){const r=R(3500);if(r<=20)shotNew(e.x,e.y,-1,0,14);else if(r<=100)shotNew(e.x,e.y,-1,0,12);else if(r<=140)shotNew(e.x,e.y,-1,0,13);}
    e.dead=true;}
  else if(e.type!==23){const n=R(4)+1;for(let k=0;k<n;k++){if(e.type===0)particle(e.x-25,e.y-25,2);else particle(e.x-25,s.y-25,1);sfx('hit');}}
  if(!(s.type===5||(s.type===4&&e.type!==0)))s.act=false;
  if(s.type===4)explosion(s.x,s.y,0,1);}

// ---------- ship (0x41ced0)
// the ship can only be steered while the level runs (0x49645c = 0) or a boss is there (0x496704)
const steerable=()=>G.endPhase===0||G.bossActive;
function updatePlayer(){
  if(P.dead){deathStep();return;}
  const u=K.up(),d=K.down(),l=K.left(),r=K.right(),ok=steerable();

const CON={open:false,ac:false,lines:Array(9).fill(''),input:'',tag:0x78,t:-1e9,base:null,ship:'player',xmas:false,bullet:false,clock:0};

    case 'rick dangerous':conCheat();conSay('Powerlines hinzugefügt');P.lines+=5;break;
    case 'master of puppets':conCheat();conSay('99 Leben für die Loser');G.lives=99;break;
    case 'ping pong':conCheat();conSay('Bounce-State Maximum');P.lvl[2]=4;break;
    case 'we will rock you':conCheat();conSay('Laser-State Maximum');P.lvl[1]=4;break;
    case 'feuerwuxe':conCheat();conSay('Spread-State Maximum');P.lvl[0]=4;break;
    case 'pfundi':conSay('Selbstzerstörungs-Sequenz eingeleitet !!!');killPlayer();G.lives=1;break;
    case 'dosenhalter':break;   // mciSendString("set cdaudio door open"), no answer
    case 'katakis':conSay('Wer das Original nicht kennt, hat was verpasst !');CON.ship='player2';break;
    case 'wanderwuxe':conSay('Normales Raumschiff gewählt');CON.ship='player';break;
    case 'crazy volcanos':conCheat();conSay('Feigling !');VOLCANO_SAFE=true;break;

    case 'bullettime mode off':conSay('Bullettime-Mode aus');CON.bullet=false;break;

function conStep(){const now=CON.clock;CON.clock+=CON.bullet?70:1000/FPS;

    if(!CON.open){if(ok){CON.base=snapScreen();CON.open=true;CON.input='';CON.tag=45;CON.t=now;}CON.ac=false;}
    else{if(ok){CON.open=false;CON.tag=45;CON.t=now;}CON.ac=true;}}
  if(!CON.open)return;
  for(let k=0;k<27;k++){const code=k<26?'Key'+String.fromCharCode(65+k):'Space';
    if(keys[code]&&CON.t<=now-150){if(CON.input.length<50){CON.input+=k<26?String.fromCharCode(97+k):' ';sfx('klippikloppi');}CON.tag=k<26?97+k:32;CON.t=now;}}
  if(keys.Backspace&&!(CON.tag===42&&CON.t>now-150)){if(CON.input.length){CON.input=CON.input.slice(0,-1);sfx('klippikloppi');}CON.tag=42;CON.t=now;}
  if(enter()&&!(CON.tag===43&&CON.t>now-500)){
    if(CON.input===''){sfx('klippikloppi');conPush();}else{conCmd(CON.input);CON.input='';}
    CON.tag=43;CON.t=now;}
  onScr(conDraw);}
function conDraw(){ctx.drawImage(CON.base,0,0);bw('console',0,0);
  ctx.save();ctx.font='bold 13px "Microsoft Sans Serif",Tahoma,Arial,sans-serif';ctx.textBaseline='top';ctx.fillStyle='#fff';
  CON.lines.forEach((s,i)=>ctx.fillText(s,25,5+i*20));ctx.fillText('> '+CON.input,25,185);ctx.restore();}

// ---------- main loop
function step(){G.frame++;musicTick();
  // remake helpers: M sound on/off, -/+ music volume, F9 info mode
  if(CON.open)pressed={};   // the console takes the letters
  if(pressed.KeyM){muted=!muted;if(muted)for(const k in VOICE)sfxStop(k);}
  if(pressed.Minus||pressed.NumpadSubtract){OPTS.music=Math.max(0,OPTS.music-10);optsApply();optsSave();}
  if(pressed.Equal||pressed.NumpadAdd){OPTS.music=Math.min(100,OPTS.music+10);optsApply();optsSave();}
  if(pressed.F9)G.info=!G.info;
  if(G.blk){blkStep();pressed={};return;}
  if(G.wait){if(!G.wait.test()){const f=G.wait.fn;G.wait=null;f();}pressed={};return;}
  switch(G.state){
    case 'boot':{const any=()=>Object.values(keys).some(v=>v);
      if(any()||G.clicked){G.clicked=false;waitUp(any,()=>{G.state='intro';G.sub=0;});}break;}
    case 'intro':introStep();break;
    case 'title':titleStep();break;
    case 'menu':menuStep();break;
    case 'newgame':newGameStep();break;
    case 'options':optionsStep();break;
    case 'joystick':joystickStep();break;
    case 'help':helpStep();break;
    case 'hiscore':hiscoreStep();break;
    case 'credits':creditsStep();break;
    case 'ready':
      if(G.timer===0){sfx('v_online');onScr(drawReady);G.timer=1;fadeIn(6,null);break;}
      if(++G.timer>150)G.state='play';break;   // wait 2 s (0x425bd0)
    case 'save':saveStep();break;
    case 'play':
      if(G.go){gameOverStep();break;}
      if(G.over){if(G.over==='help')helpStep();else if(G.over==='options')optionsStep();else quitStep();break;}
      conStep();if(CON.ac)break;   // console (0x425c50): while it is open the game stands still
      if(G.paused){if(pressed.KeyP)G.paused=false;break;}   // remake: P pauses
      if(pressed.KeyP){G.paused=true;break;}
      if(pressed.F4){if(G.bossActive)V.w32(0x494050,0);else if(G.scroll<=G.maxScroll)G.scroll=G.maxScroll+1;}   // remake: skip the stage
      updatePlay();overlays();break;
    case 'end':endStep();break;
  }
  pressed={};}
let acc=0,last=performance.now();
function loop(now){try{const dt=Math.min(100,now-last);last=now;acc+=dt;let n=0;const fm=CON.bullet?70:1000/FPS;while(acc>=fm&&n<4){step();acc-=fm;n++;}render();}catch(e){window.__lastErr=String(e)+' | '+(e.stack||'');console.error(e);}requestAnimationFrame(loop);}
loadAssets().then(()=>{msg.hidden=true;cv.focus();optsApply();requestAnimationFrame(loop);});
})();
</script>
