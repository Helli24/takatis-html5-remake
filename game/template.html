function shot(kind,x,y,w,h,vx,vy,dmg,o){const s={kind,x,y,w,h,vx,vy,dmg,f:0};if(o)Object.assign(s,o);G.shots.push(s);return s;}
function fireSpread(){const lv=P.lvl[0],sp=(dx,vx,vy,fr)=>shot('spread',P.x+dx,P.y+20,18,17,vx,vy,3,{fixed:fr});
  sp(35,8,0,0);
  if(lv>=2){const dx=lv===4?47:45;sp(dx,7,-1,1);sp(dx,7,1,2);}
  if(lv>=3){sp(50,6,-2,3);sp(50,6,2,4);}
  if(lv>=4){sp(53,5,-3,5);sp(53,5,3,6);}
  sfx('spread',0.35);P.cool=20;}
function fireLaser(){const lv=P.lvl[1];   // two shots, each on its own half of the sine wave
  for(const v of [0,1])shot('laser',P.x+38,P.y+21,24,12,5,0,LASER_DMG[lv-1],{laser:{v,off:0,dir:0,f:0},y0:P.y+21});
  sfx('laser',0.25,1+lv*.1);P.cool=LASER_CD[lv-1];}
const F32=Math.fround,F02=Math.fround(0.2);
function laserStep(s){const L=s.laser,sg=L.v?-1:1;   // float32 arithmetic and truncation exactly as in the original
  if(L.off*sg>=30){L.dir=0;L.f=-L.f;}if(L.off*sg<=0){L.dir=1;L.f=1;}
  L.off+=(L.dir?2:-2)*sg;L.f=F32(L.f-F02);L.off+=Math.trunc(L.f)*sg;s.y=s.y0+L.off;}
function fireBounce(){const lv=P.lvl[2];
  shot('bounce1',P.x+40,P.y+17,24,24,9,0,4,{bounce:1});
  if(lv===4){shot('bounce3',P.x+40,P.y+17,12,12,8,-3,3,{bounce:3});shot('bounce3',P.x+40,P.y+17,12,12,8,3,3,{bounce:3});}
  sfx('bounce',0.4);P.cool=lv<4?30:20;}
function fireRocket(){P.rockets--;shot('rocket',P.x+30,P.y+20,16,16,6,0,100,{homing:true,target:null,fr:2});sfx('rocket',0.5);}
function fireLine(){P.lines--;const segs=[];for(let y=0;y<=384;y+=32)segs.push({y,alive:true});   // 13 segments over the whole screen height
  G.lines.push({x:P.x+50,segs,t:0});sfx('powerline',0.6);}
function releaseBeam(){const c=P.beam;P.beam=0;   // charge 0..248; exactly 110 and 180 fire nothing, as in the original
  const lv=c>40&&c<110?1:c>110&&c<180?2:c>180&&c<248?3:c===248?4:0;if(!lv)return;
  const B=[[34,25,16,8,10],[35,20,32,16,15],[35,16,48,24,20],[35,11,64,32,25]][lv-1];
  shot(['beammini','beamsmall','beammed','beambig'][lv-1],P.x+B[0],P.y+B[1],B[2],B[3],8,0,B[4],{beam:lv,anim:true});sfx('beam',0.5,0.8+lv*.1);}
// bounce balls: 1 = big (24px), 2 = medium (18px), 3 = small (12px). b = the tile or enemy box that was hit.
// Returns true when the ball survives.
function bounceHit(s,b,wall){const lv=P.lvl[2];
  if(s.bounce===1){if(lv!==1)for(const vy of [9,-9])shot('bounce2',s.x-9,s.y,18,18,-9,vy,5,{bounce:2});return false;}
  if(s.bounce===2&&lv!==2){   // medium splits into two small balls, direction from the face that was hit
    if(s.vx<0){const right=b.x+b.w-s.x;let q;
      if(s.vy<0)q=b.y+b.h-s.y<=right?[[0,9,-9,9],[0,9,9,9]]:[[9,0,9,-9],[9,0,9,9]];
      else if(s.vy>0)q=s.h-(b.y-s.y)<=right?[[0,-9,-9,-9],[0,-9,9,-9]]:[[9,0,9,-9],[9,0,9,9]];
      if(q)for(const [dx,dy,vx,vy] of q)shot('bounce3',s.x+dx,s.y+dy,12,12,vx,vy,5,{bounce:3});}
    return false;}
  if(!wall)return false;   // small balls (and medium ones at stage 2) die on enemies but reflect off walls
  let n=0,fa=false,fb=false;const right=b.x+b.w-1-s.x,left=s.w-(b.x-s.x),below=b.y+b.h-1-s.y,above=s.h-(b.y-s.y);
  if(s.vx<0&&s.vy<0){if(below<=right){s.vy=-s.vy;s.y+=11;fa=true;}else{s.vx=-s.vx;s.x+=11;}n++;}
  if(s.vx<0&&s.vy>0&&!fa){if(above<=right){s.vy=-s.vy;s.y-=11;}else{s.vx=-s.vx;s.x+=11;}n++;}
  if(s.vx>0&&s.vy<0){if(b.y+b.h-s.y<=left){s.vy=-s.vy;s.y+=11;fb=true;}else{s.vx=-s.vx;s.x-=11;}n++;}
  if(s.vx>0&&s.vy>0&&!fb){if(above<=left){s.vy=-s.vy;s.y-=11;}else{s.vx=-s.vx;s.x-=11;}n++;}
  return n<2;}
const ROCKET_FR=(vx,vy)=>vy<0?(vx>0?1:vx<0?7:0):vy>0?(vx>0?3:vx<0?5:4):(vx>0?2:vx<0?6:-1);
function rocketTarget(s){const ok=e=>!e.dead&&!e.trigger&&e.type!==0&&e.type!==39&&!(e.type>=18&&e.type<=21);
  s.vx=6;s.vy=0;s.target=G.enemies.find(e=>ok(e)&&!e.rtarget)||G.enemies.find(ok)||null;if(s.target)s.target.rtarget=true;}
function rocketStep(s){if(s.target&&s.target.dead)s.target=null;if(!s.target)rocketTarget(s);
  if(s.target){const ax=d=>d>=6?6:d>0?1:d<=-6?-6:d<0?-1:0;s.vx=ax(s.target.x-s.x);s.vy=ax(s.target.y+(s.target.off||0)-s.y);}
  const fr=ROCKET_FR(s.vx,s.vy);if(fr>=0)s.fr=fr;}

// ---------- pickups (0x41eace): no weapon switch, fixed points per item
function pickup(kind){
  if(kind==='spread'||kind==='laser'||kind==='bounce'){const i=ITEMS.indexOf(kind);if(P.lvl[i]<4)P.lvl[i]++;G.score+=1000;sfx('v_'+kind,0.8);}
  else if(kind==='rocket'){if(P.rockets<16)P.rockets++;G.score+=100;sfx('v_homing',0.8);}
  else if(kind==='line'){if(P.lines<16)P.lines++;G.score+=200;sfx('v_line',0.8);}
  else if(kind==='shield'){if(P.shield<=0)sfx('shield',0.5);P.shield=1000;G.score+=500;sfx('v_shield',0.8);}
  else if(kind==='oneup'){G.lives++;G.score+=2500;sfx('v_oneup',0.8);}}

// ---------- damage: 3 energy, death below 0; enemy shot -1, ramming -2; no invulnerability frames
function hurtPlayer(amount){if(P.dead||G.state!=='play')return;P.energy-=amount;if(P.energy<0)killPlayer();else sfx('hit',0.5);}
function killPlayer(){if(P.dead)return;P.dead=400;explode(P.x+24,P.y+17,true,true);for(let i=0;i<3;i++)G.fx.push({spr:'debris'+(1+i),x:P.x+16+i*8,y:P.y+8,vx:(Math.random()-.5)*4,vy:-2-Math.random()*3,f:0,rate:6,n:16,grav:true,life:70});}
function enemyDie(e,byShot){G.score+=e.score*(byShot?5:1);   // shot kills add the points once per explosion step (5x)
  explode(e.x+e.w/2,e.y+e.h/2,e.w>=48);if(!byShot)return;
  const drop=(k,x,y)=>G.items.push({kind:k,x,y,w:20,h:20,t:0});
  if(e.type===6){drop('rocket',e.x+10,e.y+10);drop('rocket',e.x-10,e.y+25);drop('rocket',e.x+30,e.y+25);}   // extra load of the claws
  if(e.type===7)drop('line',e.x+10,e.y+10);
  if(e.type===28)for(let k=0;k<5;k++)for(const [v,s] of [[[-3,-3],'spike1'],[[3,3],'spike1'],[[3,-3],'spike2'],[[-3,3],'spike2']])eshot(e.x+28,e.y+28,v[0],v[1],s);
  if(!(e.type>=3&&e.type<=9)&&!(e.type>=18&&e.type<=21)){const r=Math.floor(Math.random()*3500);
    const k=r<=20?'shield':r<=100?'rocket':r<=140?'line':null;if(k)G.items.push({kind:k,x:e.x,y:e.y,w:20,h:20,t:0});}}
function damageEnemy(e,dmg,sx,sy){if(e.trigger)return false;if(e.hp>=1e9){puff(sx,sy);sfx('hit',0.3);return true;}e.hp-=dmg;if(e.hp<=0){enemyDie(e,true);e.dead=true;}else{puff(sx,sy);sfx('hit',0.3);}return true;}

// ---------- update
function updatePlayer(){
  if(P.dead){P.dead--;
    if(P.dead>100)for(let i=0;i<5;i++)if(Math.random()*10<1){G.fx.push({spr:'explosion',x:P.x+Math.floor(Math.random()*21)-10-6,y:P.y+Math.floor(Math.random()*51)-25-8,f:0,rate:4,n:8});if(P.dead%8===0)sfx('explosion',0.4);}
    if(P.dead===0){G.lives--;if(P.rockets>0)P.rockets--;if(P.lines>0)P.lines--;
      if(G.lives<=0){G.state='gameover';G.timer=240;sfx('v_bigone',0.8);musicPlay('highscore');}
      else{const half=level().wb*16;startLevel(G.level,G.scroll>half?half:0,true);}}
    return;}
  if(G.boss&&BOSS.phase==='approach'){P.bank-=Math.sign(P.bank);return;}
  const u=K.up(),d=K.down(),l=K.left(),r=K.right();
  if(!u&&!d)P.bank-=Math.sign(P.bank);
  if((u&&d)||(l&&r))P.bank-=Math.sign(P.bank);   // opposite keys cancel all movement
  else{const v=P.spd||3;if(u){P.bank=Math.min(10,P.bank+1);P.y=Math.max(1,P.y-v);}if(d){P.bank=Math.max(-10,P.bank-1);P.y=Math.min(382,P.y+v);}
    if(l)P.x=Math.max(0,P.x-v);if(r)P.x=Math.min(591,P.x+v);}
  // walls
  if(tileHit(shipShape()))killPlayer();   // walls kill on the first touching pixel, shield or not
  // weapons
  const fire=K.fire(),ctrl=K.beam(),L=P.latch;
  if(ctrl&&!fire)P.beam=Math.min(248,P.beam+2);else releaseBeam();   // releasing Ctrl or pressing fire lets the beam go
  if(!fire){L.fire=false;L.bounce=false;}
  if(fire&&P.weapon===0&&!L.fire){L.fire=true;fireSpread();}                     // spread: one shot per key press, no cooldown
  if(fire&&P.weapon===1&&P.lvl[1]>0&&P.cool===0)fireLaser();                     // laser: the only autofire weapon
  if(fire&&P.weapon===2&&P.lvl[2]>0&&!L.bounce){L.bounce=true;fireBounce();}     // bounce: one ball per key press
  const ent=keys.Enter||keys.NumpadEnter,sh=keys.ShiftLeft||keys.ShiftRight;
  if(ent&&P.lines>0&&!L.line)fireLine();L.line=ent;
  if(sh&&P.rockets>0&&!L.rocket)fireRocket();L.rocket=sh;
  // weapon select: 1 spread, 2 bounce, 3 laser, numpad 0 cycles; the voice repeats at most every 50 frames
  const sel=(w,v)=>{P.weapon=w;if(P.swcool===0){sfx('v_'+v,0.8);P.swcool=50;}};
  if(keys.Digit1)sel(0,'spread');if(keys.Digit3)sel(1,'laser');if(keys.Digit2)sel(2,'bounce');
  if((keys.Numpad0||keys.KeyQ)&&P.swcool===0){if(P.weapon===0)sel(2,'bounce');else if(P.weapon===1)sel(0,'spread');else sel(1,'laser');}
  if(P.cool>0)P.cool--;if(P.swcool>0)P.swcool--;if(P.shield>0)P.shield--;
}
function playerFrame(){const b=P.bank;return b===10?4:b>=5?3:b===-10?2:b<=-5?1:0;}
// ---------- pixel collision (0x412f50): two shapes touch where both source pixels are not the colour key
const MASKS=new Map();
function maskOf(img){let m=MASKS.get(img);if(m)return m;const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const g=c.getContext('2d');g.drawImage(img,0,0);const d=g.getImageData(0,0,c.width,c.height).data,a=new Uint8Array(c.width*c.height);
  for(let i=0;i<a.length;i++)a[i]=d[i*4+3]>127?1:0;m={w:c.width,a};MASKS.set(img,m);return m;}
function shapeOf(sp,f,x,y){const s=S[sp];f=((f|0)%s.frames+s.frames)%s.frames;
  return {img:s.img,sx:(f%s.cols)*s.fw,sy:Math.floor(f/s.cols)*s.fh,w:s.fw,h:s.fh,x:Math.round(x),y:Math.round(y)};}
function pixHit(A,B){const x0=Math.max(A.x,B.x),y0=Math.max(A.y,B.y),x1=Math.min(A.x+A.w,B.x+B.w),y1=Math.min(A.y+A.h,B.y+B.h);if(x0>=x1||y0>=y1)return false;
  const ma=maskOf(A.img),mb=maskOf(B.img);
  for(let y=y0;y<y1;y++){const ra=(A.sy+y-A.y)*ma.w+A.sx-A.x,rb=(B.sy+y-B.y)*mb.w+B.sx-B.x;for(let x=x0;x<x1;x++)if(ma.a[ra+x]&&mb.a[rb+x])return true;}
  return false;}
// first foreground tile whose pixels touch the shape, as {x,y,w,h} in playfield coordinates
function tileHit(A){const l=level(),ts=T[l.theme].tsa,ox=Math.floor(G.scroll);
  const c0=Math.max(0,Math.floor((A.x+ox)/32)),c1=Math.min(l.wb-1,Math.floor((A.x+A.w-1+ox)/32)),r0=Math.max(0,Math.floor(A.y/32)),r1=Math.min(12,Math.floor((A.y+A.h-1)/32));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=l.B[r*l.wb+c];if(!t)continue;
    const B={img:ts,sx:(t%10)*32,sy:Math.floor(t/10)*32,w:32,h:32,x:c*32-ox,y:r*32};if(pixHit(A,B))return B;}
  return null;}
const shipShape=()=>shapeOf('player',playerFrame(),P.x,P.y);
const shotShape=s=>s.kind==='rocket'?shapeOf('rocket',s.fr,s.x,s.y):shapeOf(s.kind,s.fixed!==undefined?s.fixed:Math.floor(s.f/(s.anim?4:2)),s.x,s.y);
const eshotShape=s=>shapeOf(s.spr,s.fixed!==undefined?s.fixed:Math.floor(s.f/4),s.x,s.y);
const enemyShape=e=>e.spr?shapeOf(e.spr,e.f,e.x+(e.type===17?G.shake:0),e.y+(e.off||0)):null;
function enemyTouch(A,e){const B=enemyShape(e);return B?pixHit(A,B):hit(A,e);}
function updateShots(){
  for(const s of G.shots){s.f++;
    if(s.homing)rocketStep(s);
    s.x+=s.vx;if(s.laser){s.y0+=s.vy;laserStep(s);}else s.y+=s.vy;
    const wt=tileHit(shotShape(s));
    if(s.bounce){if(wt&&!bounceHit(s,wt,true)){s.dead=true;sfx('hit',0.2);}}
    else if(wt){s.dead=true;sfx('hit',0.2);if(s.target)s.target.rtarget=false;
      if(s.beam===4)G.fx.push({spr:'beamexplode',x:s.x+s.w-25,y:s.y+s.h/2-25,f:0,rate:3,n:5});else if(!s.beam)puff(s.x+s.w,s.y+s.h/2);}
    if(s.x>W+40||s.x<-60||s.y<-40||s.y>PH+40)s.dead=true;
    if(s.dead)continue;
    for(const e of G.enemies){if(e.dead||e.trigger||!(s.homing?hit(s,e):enemyTouch(shotShape(s),e)))continue;   // rockets hit on the box
      if(e.type===23||e.type===22){puff(s.x+s.w,s.y+s.h/2);s.dead=true;break;} // force field eats shots
      damageEnemy(e,s.dmg,s.x+s.w,s.y+s.h/2);
      if(s.bounce){bounceHit(s,e,false);s.dead=true;}
      else if(!(s.beam===4&&e.type!==0))s.dead=true;   // the biggest beam passes through everything but asteroids
      if(s.beam===4)G.fx.push({spr:'beamexplode',x:s.x+s.w-25,y:s.y+s.h/2-25,f:0,rate:3,n:5});
      if(s.dead)break;}
  }
  G.shots=G.shots.filter(s=>!s.dead);
  // powerline: 13 segments, 15 px per frame, 8 damage on every frame of contact, not stopped by enemies
  for(const L of G.lines){L.x+=15;L.t++;for(const sg of L.segs){if(!sg.alive)continue;const ls=shapeOf('powerline',Math.floor(L.t/3),L.x,sg.y);if(tileHit(ls)){sg.alive=false;continue;}
      for(const e of G.enemies){if(e.dead||e.trigger)continue;if(enemyTouch(ls,e))damageEnemy(e,8,L.x+8,sg.y+16);}}
    if(L.x>W||!L.segs.some(s=>s.alive))L.dead=true;}
  G.lines=G.lines.filter(l=>!l.dead);
  // enemy shots: the player box is the full 49x31 ship rectangle; the shield absorbs them
  for(const s of G.eshots){s.x+=s.vx-(G.speed-1);s.y+=s.vy;if(s.grav&&s.f%16===15)s.vy+=1;s.f++;if(s.x<-20||s.x>W+20||s.y<-20||s.y>PH+20||tileHit(eshotShape(s)))s.dead=true;
    if(!s.dead&&!P.dead&&hit(s,{x:P.x,y:P.y,w:49,h:31})){s.dead=true;if(P.shield<=0)hurtPlayer(1);}}
  G.eshots=G.eshots.filter(s=>!s.dead);
}
function eshot(x,y,vx,vy,spr,opt={}){const s=S[spr];G.eshots.push({x,y,w:s.fw,h:s.fh,vx,vy,spr,f:0,fixed:opt.frame,grav:opt.grav,ghost:opt.ghost,world:opt.world});}
function shootAt(e,speed=3,spr='bullet',size=8){const cx=e.x+e.w/2,cy=e.y+e.h/2;const ang=Math.atan2(P.y+17-cy,P.x+24-cx);G.eshots.push({x:cx-size/2,y:cy-size/2,w:size,h:size,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,spr,f:0});}
function updateEnemies(){const l=level();
  while(G.next<l.objects.length&&l.objects[G.next][1]<=G.scroll+W){spawn(l.objects[G.next]);G.next++;}
  P.spd=3;G.shake=0;   // the draw code resets the ship speed every frame; an attached magnet sets it to 1 (0x42c065, 0x40a610)
  for(const e of G.enemies){e.t++;
    if(e.type===17){   // faller (0x40a6bb): waits until the ship's nose passes, shakes for 30 frames, then drops at 6 px per frame
      if(e.dy!==6)e.dy=0;if(P.x+49>e.x&&e.dy!==6&&!e.arm)e.arm=1;
      if(e.arm&&e.dy!==6){e.arm++;G.shake=Math.floor(Math.random()*6)-3;}if(e.arm===30)e.dy=6;}
    if(e.type===16&&e.att)P.spd=1;
    stepPath(e);
    const cx=e.x+e.w/2,cy=e.y+e.h/2,A=e.an;
    switch(e.type){   // attacks from the enemy update 0x40a260; cooldowns start at 0 when the enemy appears
      case 2:if(A.cnt===1&&e.cd<=0&&Math.floor(Math.random()*11)===1){eshot(e.x,e.y+3,-5,0,'blob');eshot(e.x,e.y+33,-5,0,'blob');sfx('laser',0.3);e.cd=10;}break;
      case 12:if(e.cd<=0){eshot(e.x-4,e.y-12,-4,-3,'walkershot');sfx('bounce',0.3);e.cd=70;}break;
      case 14:if(e.cd<=0){eshot(e.x-8,e.y+29,-5,0,'bullspread',{frame:0});eshot(e.x-8,e.y+29,-4,-2,'bullspread',{frame:1});eshot(e.x-8,e.y+29,-4,2,'bullspread',{frame:2});sfx('spread',0.4);e.cd=200;}break;
      case 24:if(lastTick(e,4))eshot(e.x+60,e.y,-1,0,'mine');break;
      case 15:if(e.cd<=0){eshot(e.x-15,e.y+7,-4,0,'chaseshot');sfx('laser',0.3);e.cd=150;}break;
      case 25:if(lastTick(e,18)&&!A.dir){eshot(e.x,e.y+27,-6,0,'elevatorshot');burst(e.x,e.y+20,5,10);sfx('laser',0.3);}break;
      case 30:if(lastTick(e,1)&&!A.dir){for(const q of [[16,-7,-1,-2],[-5,16,-3,0],[16,37,-1,2],[40,16,1,0],[0,0,-2,-1],[28,0,0,-1],[0,33,-2,1],[28,33,0,1]])eshot(e.x+q[0],e.y+q[1],q[2],q[3],'bullet');sfx('bigshot',0.3);}break;
      case 32:if(e.cd<=0){const pick=()=>{let v=0;while(v<3&&v>-3)v=Math.floor(Math.random()*8)-4;return v;};const vx=pick(),vy=pick();eshot(e.x+10,e.y+10,vx,vy,'blob');sfx('bounce',0.3);e.cd=50;}break;
      case 33:if(P.x+49>e.x-70&&P.x<e.x+106&&P.y<e.y+131&&P.y+34>e.y-70){   // the fake claw turns into a spike ball (0x40afa0)
        burst(e.x,e.y+20,80,50);sfx('morph',0.7);
        Object.assign(e,{type:28,hp:120,hp0:120,score:500,w:72,h:72,x:e.x-10,y:e.y-10,spr:'e28',an:{col:0,row:0,cnt:1,dir:0,tick:0}});}break;
      case 31:if(lastTick(e,10)&&!A.dir){for(let yy=0;yy<PH;yy+=32)eshot(e.x+50,yy,7,0,'powerline');sfx('powerline',0.6);}break;   // fires once
      case 29:if(e.cd===0){const vx=Math.floor(Math.random()*8)-4;let vy=0;while(vy>-1)vy=-Math.floor(Math.random()*6);eshot(e.x+24,e.y-15,vx,vy,'volcanoball',{grav:true});sfx('bounce',0.3);e.cd=50;}break;
    }
    e.cd--;
    if(e.hp<=e.hp0/2&&Math.floor(Math.random()*7)===3)G.fx.push({spr:'smoke',x:cx-8,y:cy-8,vx:-0.6,vy:-0.7,f:0,rate:2,n:16});
    animStep(e);
    // every enemy except circuits and presses is destroyed when it overlaps a foreground tile (0x42ca80)
    if(e.type!==13&&e.type!==26&&e.type!==27&&boxInTiles(e.x,e.y,e.w,e.h)){explode(cx,cy,e.w>=48);e.dead=true;continue;}
    if(e.x<-e.w||e.y<-300-PY||e.y>780-PY)e.dead=true;   // off the left edge or far above/below (0x40b5f0)
    if(e.dead||P.dead)continue;
    if(enemyTouch(shipShape(),e)){   // ship against enemy: pixel test (0x40bc2a)
      if(e.type===16){e.x=P.x+30;e.y=P.y;e.att=true;continue;}   // the magnet sticks to the ship (0x40bc3f)
      // ramming (0x40bb61): costs 2 energy and removes the enemy; with the shield only 26/27/39 still kill.
      // Enemies overlapping the left screen edge kill outright without the shield.
      if(e.x<0){if(P.shield<=0)killPlayer();else if(e.type===26||e.type===27)hurtPlayer(2);continue;}
      if(P.shield<=0){hurtPlayer(2);e.dead=true;}
      else if(e.type===26||e.type===27||e.type===39){killPlayer();continue;}
      if(![22,23,26,27,39].includes(e.type)){enemyDie(e,false);e.dead=true;}
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  for(const it of G.items){it.t++;if(it.carrier&&!it.carrier.dead){it.x=it.carrier.x+8;it.y=it.carrier.y+42;}else it.x-=G.speed;
    if(it.x<-30)it.dead=true;if(!P.dead&&hit(it,{x:P.x,y:P.y,w:49,h:31})){pickup(it.kind);it.dead=true;}}
  G.items=G.items.filter(i=>!i.dead);
  for(const f of G.fx){f.f+=1/f.rate;if(f.vx!==undefined){f.x+=f.vx;f.y+=f.vy;if(f.grav)f.vy+=0.15;}if(f.life!==undefined){if(--f.life<=0)f.dead=true;}else if(f.f>=f.n)f.dead=true;}
  G.fx=G.fx.filter(f=>!f.dead);
}
function updatePlay(){
  if(G.level===6){if(G.scroll===4270&&G.speed===1)G.speed=-2;else if(G.scroll===2970&&G.speed===-2)G.speed=2;}   // 4-1 scrolls backwards (0x41575f)
  G.scroll+=G.speed;
  if(G.level%2===1&&!G.bigone&&G.scroll>G.maxScroll-640){G.bigone=true;sfx('v_bigone',0.8);}
  if(G.scroll>=G.maxScroll){G.scroll=G.maxScroll;if(G.level%2===1&&!G.boss&&!G.bossDone)bossBegin();else if(!G.boss)G.stageClear=true;}
  updatePlayer();updateShots();updateEnemies();
  if(G.boss){bossStep();bossShots();}   // like the original: enemies, then the boss routine, then the collisions
  if(G.stageClear&&!P.dead){G.state='clear';G.timer=200;G.lives++;sfx('bigshot',0.6);musicPlay('clear');}
}

// ---------- render
function drawLayer(map,w,ts,ox){const c0=Math.max(0,Math.floor(ox/32)),c1=Math.min(w-1,Math.floor((ox+W)/32));
  for(let r=0;r<13;r++)for(let c=c0;c<=c1;c++){const t=map[r*w+c];if(!t)continue;ctx.drawImage(ts,(t%10)*32,Math.floor(t/10)*32,32,32,c*32-ox,r*32,32,32);}}
function drawPlayfield(){const l=level(),th=T[l.theme];
  ctx.save();ctx.beginPath();ctx.rect(0,PY,W,PH);ctx.clip();ctx.translate(0,PY);
  ctx.drawImage(th.stc,0,0);
  drawLayer(l.A,l.wa,th.tsb,Math.floor(G.scroll/2));
  // behind-player things
  for(const it of G.items)frame(ITEM_SPR[it.kind],0,it.x,it.y);
  // draw order of 0x42bdb0: enemies behind the foreground tiles, presses in front of them
  const drawEnemy=e=>{if(e.spr)frame(e.spr,e.f,e.x+(e.type===17?G.shake:0),e.y+(e.off||0),e.dir<0);};
  for(const e of G.enemies)if(e.type!==26&&e.type!==27)drawEnemy(e);
  if(G.boss&&G.level===3)bossDraw();
  drawLayer(l.B,l.wb,th.tsa,Math.floor(G.scroll));
  for(const e of G.enemies)if(e.type===26||e.type===27)drawEnemy(e);
  if(G.boss&&G.level!==3)bossDraw();
  for(const L of G.lines)for(const sg of L.segs)if(sg.alive)frame('powerline',Math.floor(L.t/3),L.x,sg.y);
  for(const s of G.shots){if(s.kind==='rocket'){frame('rocket',s.fr,s.x,s.y);}else frame(s.kind,s.fixed!==undefined?s.fixed:Math.floor(s.f/(s.anim?4:2)),s.x,s.y);}
  for(const s of G.eshots)frame(s.spr,s.fixed!==undefined?s.fixed:Math.floor(s.f/4),s.x,s.y);
  if(!P.dead){frame('player',playerFrame(),P.x,P.y);
    if(P.shield>0){const u=1000-P.shield;if(u<=500||(u<=750&&u%2===0)||u%4===0)frame('shield',Math.floor(u/5)%8,P.x,P.y);}
}
  for(const f of G.fx)frame(f.spr,f.f,f.x,f.y);
  ctx.restore();}
function drawHUD(){const hb=S.hudbottom;ctx.drawImage(S.hudtop.img,0,0);ctx.drawImage(hb.img,0,H-48);
  // weapon stages (0x41c34c): one ws.gfx block per stage, 7 px apart; spread x=122, bounce x=222, laser x=322
  for(const [x,n] of [[122,P.lvl[0]],[222,P.lvl[2]],[322,P.lvl[1]]])for(let i=0;i<n;i++)ctx.drawImage(S.ws.img,x+i*7,3);
  num(P.rockets,422+String(P.rockets).length*4,3);num(P.lines,522+String(P.lines).length*4,3);
  num(G.lives,98,457);num(level().stage,160,457);num(G.score,514,457);
  for(let i=0;i<3;i++){if(i<P.energy)frame('energy',0,196+i*96,439);}
  if(P.beam>0){const s=S.beamload;const wdt=P.beam;ctx.drawImage(s.img,0,0,wdt,24,197,452,wdt,24);}
  if(G.boss)bossHUD();
  if(G.info){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,PY,250,110);const rows=['Scrollposition: '+Math.round(G.scroll),'Scrollspeed   : '+G.speed,'Anzahl Enemys : '+G.enemies.filter(e=>!e.trigger).length,'Anzahl Shots  : '+(G.shots.length+G.eshots.length),'Anzahl Expl.  : '+G.fx.length,'Next Object   : '+G.next+'/'+level().objects.length];rows.forEach((r,i)=>text(r,4,PY+4+i*17,3));}}
function drawCenter(str,y,row=0){text(str,W/2,y,row,1);}
const HELP=[['STEUERUNG','CURSOR / NUMPAD  BEWEGEN','SPACE  PRIMAERWAFFE','STRG  BEAM AUFLADEN','SHIFT  RAKETE','RETURN  POWERLINE','1 2 3  WAFFE WAEHLEN','P  PAUSE   ESC  MENUE'],
 ['PRIMAERWAFFEN','SPREAD SHOT  4 STUFEN','  BREITER STREUWINKEL','LASER  4 STUFEN','  DAUERFEUER, SCHNELL','BOUNCE  4 STUFEN','  TEILT SICH AN WAENDEN'],
 ['SEKUNDAERWAFFEN','BEAM  4 LADESTUFEN','RAKETE  ZIELSUCHEND','POWERLINE  KRAFTFELD','SCHILD  KURZ UNVERWUNDBAR','ONE UP  EXTRALEBEN'],
 ['CONTAINER','TRAEGER TRAGEN EXTRAS','ABSCHIESSEN GIBT MEHR','ALS DAS EINSAMMELN','','SPEED TRIGGER AENDERN','DIE SCROLLGESCHWINDIGKEIT'],
 ['DIE STORY','DU SITZT AM STEUERKNUEPPEL','EINES RAUMGLEITERS UND','FLIEGST DURCH EINE WELT','VOLLER FINSTERER GESTALTEN','','LETS BLAST THESE ALIENS']];
const CREDITS=['TAKATIS','A TRIBUTE TO MANFRED TRENZ','','PROGRAMMIERUNG','HEIKO KALISTA','','GRAFIK MUSIK LEVELDESIGN','JOERG M WINTERSTEIN','','3D MODELLE','MICHAEL MATZKA','','VOICES','ALEXANDRA HERTSTEIN','SEB KUGLER','','(C) 2002 POKE53280','','BROWSER REMAKE','AUS DEN ORIGINALDATEN'];
function drawMenus(){
  if(G.state==='menu'){const bw=224,bh=64;panel(W/2-bw/2-16,28,bw+32,bh*MENU_ITEMS.length+24);
    for(let i=0;i<MENU_ITEMS.length;i++)ctx.drawImage(S.menu.img,(i===G.menuSel?0:224),i*64,224,64,W/2-bw/2,40+i*64,224,64);
    return;}
  if(G.state==='start'){panel(60,60,520,340);
    drawCenter('START GAME',78,0);
    drawCenter('START A NEW GAME',110,1);
    const dn=['EASY','NORMAL','HARD'],dc=[2,4,1];   // green / yellow / red as in the original
    for(let i=0;i<3;i++)text(dn[i],150+i*130,134,dc[i],1);
    if(G.startRow===0){const cx=150+G.diff*130,hw=dn[G.diff].length*5;   // markers bracket the chosen skill
      text('>',cx-hw-12,134,dc[G.diff],1);text('<',cx+hw+12,134,dc[G.diff],1);}
    drawCenter('CONTINUE A SAVED GAME',166,1);
    text('SLOT  STAGE LIVES  WEAPONS   SKILL  SCORE',300,190,3,1);
    for(let i=0;i<SLOTS;i++){const sv=readSlot(i);const y=212+i*28;const sel=G.startRow===i+1;
      if(sel){ctx.fillStyle='rgba(160,120,40,.25)';ctx.fillRect(70,y-3,500,24);}
      text(String(i+1),90,y,sel?2:3,1);
      if(!sv)text('-- EMPTY SLOT --',300,y,sel?2:3,1);
      else{text(LEVELS[sv.level].stage,160,y,sel?2:3,1);text(String(sv.lives),225,y,sel?2:3,1);
        for(let w=0;w<3;w++)text(String(sv.lvl[w]),275+w*26,y,sel?2:3,1);
        text(dn[sv.diff],420,y,[2,4,1][sv.diff],1);text(String(sv.score),520,y,sel?2:3,1);}}
    return;}
  if(G.state==='options'){panel(120,120,400,220);drawCenter('OPTIONS',140,0);
    const rows=[['MUSIK',Math.round(MUSIC.vol*10)],['SOUND',Math.round((G.sfxVol===undefined?1:G.sfxVol)*10)],['SKILL',['EASY','NORMAL','HARD'][G.diff]]];
    rows.forEach((r,i)=>{const y=190+i*40;text(r[0],200,y,G.optSel===i?0:3,1);text(String(r[1]),380,y,i===2?[2,4,1][G.diff]:(G.optSel===i?0:3),1);});
    drawCenter('ESC  ZURUECK',310,3);return;}
  if(G.state==='help'){panel(60,60,520,340);const pg=HELP[G.page];
    drawCenter(pg[0],86,0);
    for(let i=1;i<pg.length;i++)text(pg[i],90,124+(i-1)*28,i===1?2:3);
    drawCenter('SEITE '+(G.page+1)+'/'+HELP.length+'   CURSOR BLAETTERN   ESC',368,3);return;}
  if(G.state==='hiscore'){panel(140,100,360,260);drawCenter('HIGHSCORE',124,0);
    drawCenter(String(G.hiscore),180,2);drawCenter('LETZTES SPIEL',230,3);drawCenter(String(G.score),260,3);
    drawCenter('ESC  ZURUECK',330,3);return;}
  if(G.state==='credits'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    CREDITS.forEach((l,i)=>{const y=G.creditY+i*20;if(y>-20&&y<H)text(l,W/2,y,l===l.toUpperCase()&&i<2?0:3,1);});return;}}
function render(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(G.state==='title'){ctx.drawImage(S.title.img,0,0);ctx.drawImage(S.logo.img,0,10);if(Math.floor(G.frame/30)%2)drawCenter('PRESS ESC FOR MENU',320,2);drawCenter('HIGHSCORE '+G.hiscore,352,3);return;}
  if(G.state==='menu'||G.state==='start'||G.state==='options'||G.state==='help'||G.state==='hiscore'||G.state==='credits'){
    ctx.drawImage(S.title.img,0,0);drawMenus();return;}
  drawPlayfield();drawHUD();
  if(G.state==='ready'){frame('getready',0,(W-329)/2,140);drawCenter('STAGE '+level().stage,220,0);drawCenter(level().hint,250,2);}
  else if(G.state==='gameover'){frame('gameover',0,(W-429)/2,180);}
  else if(G.state==='clear'){drawCenter('STAGE CLEAR',200,0);drawCenter('+1 LIFE',235,2);if(G.bossDone)drawCenter('BOSS DESTROYED  +10000',270,3);}
  else if(G.state==='pause'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,PY,W,PH);drawCenter('PAUSE',220,0);}
  else if(G.state==='quit'){const bx=150,by=190,bw=340,bh=110;
    ctx.fillStyle='rgba(20,10,6,.92)';ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle='#8a6a3a';ctx.lineWidth=2;ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    drawCenter('SPIEL BEENDEN ?',by+22,0);
    text('JA',bx+95,by+68,G.quitSel?1:0,1);text('NEIN',bx+245,by+68,G.quitSel?0:2,1);}
  else if(G.state==='end'){ctx.drawImage(S.endscreen.img,0,0);drawCenter('YOU FINISHED TAKATIS',400,0);drawCenter('SCORE '+G.score,430,2);}}

// ---------- main loop
function step(){G.frame++;musicTick();if(G.state==='title'&&MUSIC.want!=='title')musicPlay('title');
  if(pressed.KeyM){muted=!muted;}if(pressed.Minus||pressed.NumpadSubtract){MUSIC.vol=Math.max(0,MUSIC.vol-0.1);}if(pressed.Equal||pressed.NumpadAdd){MUSIC.vol=Math.min(1,MUSIC.vol+0.1);}
  if(pressed.F1)G.info=!G.info;
  switch(G.state){
    case 'menu':{
      if(pressed.ArrowUp)G.menuSel=(G.menuSel+MENU_ITEMS.length-1)%MENU_ITEMS.length;
      if(pressed.ArrowDown)G.menuSel=(G.menuSel+1)%MENU_ITEMS.length;
      if(pressed.Escape)G.state='title';
      if(pressed.Enter||pressed.Space){const it=MENU_ITEMS[G.menuSel];
        if(it==='start'){G.state='start';G.startRow=0;G.slotSel=0;}
        else if(it==='options'){G.state='options';G.optSel=0;}
        else if(it==='help'){G.state='help';G.page=0;}
        else if(it==='highscore')G.state='hiscore';
        else if(it==='credits'){G.state='credits';G.creditY=PH;}
        else if(it==='quit')G.state='title';}
      break;}
    case 'start':{
      if(pressed.ArrowUp)G.startRow=Math.max(0,G.startRow-1);
      if(pressed.ArrowDown)G.startRow=Math.min(SLOTS,G.startRow+1);
      if(G.startRow===0){if(pressed.ArrowLeft)G.diff=Math.max(0,G.diff-1);if(pressed.ArrowRight)G.diff=Math.min(2,G.diff+1);}
      if(pressed.Escape)G.state='menu';
      if(pressed.Enter||pressed.Space){
        if(G.startRow===0){G.lives=START_LIVES[G.diff];G.score=0;P=null;G.slot=null;startLevel(0);}
        else{const sv=readSlot(G.startRow-1);
          if(sv){G.diff=sv.diff;G.lives=sv.lives;G.score=sv.score;G.slot=G.startRow-1;P=newPlayer();P.lvl=sv.lvl.slice();P.weapon=sv.weapon;P.rockets=sv.rockets;P.lines=sv.lines;startLevel(sv.level);}
          else{G.lives=START_LIVES[G.diff];G.score=0;P=null;G.slot=G.startRow-1;startLevel(0);}}}
      break;}
    case 'options':{
      if(pressed.ArrowUp)G.optSel=(G.optSel+2)%3;if(pressed.ArrowDown)G.optSel=(G.optSel+1)%3;
      if(pressed.ArrowLeft||pressed.ArrowRight){const d=pressed.ArrowRight?1:-1;
        if(G.optSel===0)MUSIC.vol=Math.max(0,Math.min(1,MUSIC.vol+d*0.1));
        else if(G.optSel===1)G.sfxVol=Math.max(0,Math.min(1,(G.sfxVol===undefined?1:G.sfxVol)+d*0.1));
        else G.diff=Math.max(0,Math.min(2,G.diff+d));}
      if(pressed.Escape||pressed.Enter)G.state='menu';
      break;}
    case 'help':{
      if(pressed.ArrowDown||pressed.ArrowRight)G.page=Math.min(HELP.length-1,G.page+1);
      if(pressed.ArrowUp||pressed.ArrowLeft)G.page=Math.max(0,G.page-1);
      if(pressed.Escape||pressed.Enter)G.state='menu';
      break;}
    case 'hiscore':{if(pressed.Escape||pressed.Enter||pressed.Space)G.state='menu';break;}
    case 'credits':{G.creditY-=0.6;if(pressed.Escape||pressed.Enter||G.creditY<-CREDITS.length*18-40)G.state='menu';break;}
    case 'title':   // the title screen only waits; a game is always started from the menu
      if(pressed.Escape||pressed.Enter||pressed.Space){G.state='menu';G.menuSel=0;}break;
    case 'ready':G.timer--;if(G.timer===140)sfx('v_online',0.9);if(G.timer<=0||pressed.Space)G.state='play';break;
    case 'play':if(pressed.Escape){G.state='quit';G.quitSel=0;break;}
    if(pressed.KeyP){G.state='pause';break;}if(pressed.F2){if(G.boss){if(BOSS.phase==='fight')V.w32(0x494050,0);}else G.stageClear=true;}updatePlay();break;
    case 'pause':if(pressed.KeyP||pressed.Escape)G.state='play';break;
    case 'quit':
      if(pressed.ArrowLeft||pressed.ArrowRight||pressed.ArrowUp||pressed.ArrowDown)G.quitSel=G.quitSel?0:1;
      if(pressed.Escape)G.state='play';
      if(pressed.Enter||pressed.Space){if(G.quitSel){G.hiscore=Math.max(G.hiscore,G.score);try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}G.state='menu';G.menuSel=0;musicPlay('title');}else G.state='play';}
      break;
    case 'clear':G.timer--;G.fx=G.fx.filter(f=>true);for(const f of G.fx){f.f+=1/f.rate;if(f.f>=f.n)f.dead=true;}G.fx=G.fx.filter(f=>!f.dead);
      if(G.timer<=0){if(G.level+1<LEVELS.length){if(G.level%2===1&&G.slot!==null&&G.slot!==undefined)writeSlot(G.slot,{level:G.level+1,score:G.score,lives:G.lives,lvl:P.lvl,weapon:P.weapon,rockets:P.rockets,lines:P.lines,diff:G.diff});startLevel(G.level+1);}else{G.state='end';G.timer=600;musicPlay('end');}}break;
    case 'gameover':G.timer--;if(G.timer<=0||pressed.Enter){G.hiscore=Math.max(G.hiscore,G.score);try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}G.state='menu';G.menuSel=0;musicPlay('title');}break;
    case 'end':G.timer--;if(G.timer<=0||pressed.Enter){G.hiscore=Math.max(G.hiscore,G.score);try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}G.state='menu';G.menuSel=0;musicPlay('title');}break;
  }
  pressed={};}
let acc=0,last=performance.now();
function loop(now){try{const dt=Math.min(100,now-last);last=now;acc+=dt;let n=0;while(acc>=1000/FPS&&n<4){step();acc-=1000/FPS;n++;}render();}catch(e){window.__lastErr=String(e)+' | '+(e.stack||'');console.error(e);}requestAnimationFrame(loop);}
loadAssets().then(()=>{msg.hidden=true;cv.focus();try{G.hiscore=+localStorage.getItem('takatis.hiscore')||0;}catch(e){}
  setInterval(()=>{try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}},5000);requestAnimationFrame(loop);});
})();
</script>
