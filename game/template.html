  else if(type===1){do p.spr=R(5);while(p.spr<2);}
  else if(type===2){do p.spr=R(4);while(p.spr<2);}
  else if(type===6||type===7){p.spr=2;p.vx=(R(7)+1)*(type===6?1:-1);p.vy=-R(7);}
  else if(type===8){p.spr=8;let v=0;while(!v)v=R(3);p.vx=-v-(P.spd||3);p.vy=0;}
  else if(type===3||type===9||type===4||type===5){p.spr=type===4?6:type===5?7:5;p.x=x;p.y=y;}
  PART.push(p);}
// update (0x403070): drawn at the old position, then moved; 3 ticks per frame (2 for the exhaust); frames 0..14 run,
// then Debris1/2/4/5 start over while all others vanish; gravity adds 1 to vy every 6 frames (not for the exhaust)
function partUpdate(p){
  if(p.spr===0&&OPT.smoke&&R(2)===1)particle(p.x,p.y,9);
  p.draw={sx:p.col*16,sy:p.row*16,x:p.x,y:p.y};
  if(p.spr<5||p.spr>7){p.x+=p.vx;p.y+=p.vy;}
  if(++p.tick===(p.spr===8?2:3)){if(++p.col===4){p.col=0;p.row++;}
    if(p.row===3&&p.col===3){p.col=0;p.row=0;if(p.spr===2||p.spr>=5)p.x=-1000;}p.tick=0;}
  if(p.grav===6&&p.spr!==8){p.vy++;p.grav=0;}p.grav++;}
// list update (0x4035b0): after each particle the next one is dropped when it is more than 16 px outside the
// playfield; the newest particle is never checked. Particles made during the update wait for the next frame.
function partStep(){const L=PART,n=L.length,keep=[];
  for(let i=n-1;i>=0;i--){partUpdate(L[i]);keep.push(L[i]);
    if(i>0){const q=L[i-1];if(q.x<-16||q.x>W+16||q.y<-16||q.y>PH+17)i--;}}
  PART=keep.reverse().concat(L.slice(n));}
function partDraw(){for(let i=PART.length-1;i>=0;i--){const p=PART[i],d=p.draw;if(d)ctx.drawImage(S[PSPR[p.spr]].img,d.sx,d.sy,16,16,d.x,d.y,16,16);}}

// explosions (constructor 0x40d860, update 0x40da90, list 0x40dfa0). Type 0 is one of the two big explosions and
// brings the explosion sound (not while the ship or the boss is dying) and a smoke particle, 1 is the beam explosion,
// 2 the small one. A delay holds the explosion back; it does not scroll meanwhile. BltFast has no clipper: only the
// left edge is clipped, a frame that sticks out anywhere else is not drawn at all.
let EXPL=[];
const EXPL_T={0:[8,4,7,'explosion',60,50],5:[6,3,5,'explosion2',48,48],1:[5,5,5,'beamexplode',50,50],2:[6,3,5,'smallexpl',16,16]};
function explosion(x,y,delay,type){let t=type;
  if(type===0){if(R(2)!==1)t=5;if(!P.dead&&!bossDying())sfx('explosion');particle(x,y,3);}
  const [n,cols,tpf,spr,w,h]=EXPL_T[t];EXPL.push({x,y,delay,n,cols,tpf,spr,w,h,f:0,tick:0,done:false,draw:null});}
function explStep(){for(const e of EXPL){e.draw=null;if(e.delay>0){e.delay--;continue;}
    const fd=e.f,sx=(fd<e.cols?fd:fd-e.cols)*e.w,sy=fd<e.cols?0:e.h;
    if(++e.tick===e.tpf){e.f++;e.tick=0;}
    if(fd<e.n){const cut=e.x<0?-e.x:0;if(e.w-cut>0&&e.x+e.w<=W&&e.y+PY>=0&&e.y+PY+e.h<=H)e.draw={sx:sx+cut,sy,x:e.x+cut,w:e.w-cut,y:e.y};}
    if(e.f===e.n)e.done=true;
    e.x-=G.speed;}
  if(EXPL.length&&EXPL[0].done)EXPL.shift();}   // only the oldest one leaves the list, one per frame
function explDraw(){for(const e of EXPL){const d=e.draw;if(d)ctx.drawImage(S[e.spr].img,d.sx,d.sy,d.w,e.h,d.x,d.y,d.w,e.h);}}
// the staggered explosion of a destroyed enemy or ship: 5 explosions 5 frames apart around (x,y)
function explode5(x,y,type){for(let i=0;i<25;i+=5){const dx=R(21)-10,dy=R(51)-25;explosion(x+dx,y+dy,i,type);if(type===2)sfx('hit');}}
// ---------- shots (list 0x492540): the ship's shots, the enemy shots and the items share one list, one update and
// one draw pass. Constructor 0x40f3d0, update and draw 0x40fe10, collisions 0x41e570, walls in the tile pass 0x42c1d0.
// Types: 0 spread, 1-4 beam stages, 5 powerline, 7 laser, 8/9/10 bounce big/medium/small, 11 rocket; enemy side:
// 6 blob, 12-18 items (rocket, powerline, shield, spread, laser, bounce, 1up), 19 bullet, 20 walker shot, 21 bull
// spread, 22 chase shot, 23 mine, 24 elevator shot, 25/26 spikes, 27 enemy powerline, 28 volcano ball.
// Per type: sprite, frame width, height of the source rectangle, enemy side, frame given by the constructor.
const SHOT_T=[['spread',18,17,0,1],['beammini',16,8,0,1],['beamsmall',32,16,0,1],['beammed',48,24,0,1],['beambig',64,32,0,1],
  ['powerline',16,31,0,0],['blob',12,12,1,0],['laser',24,12,0,0],['bounce1',24,24,0,0],['bounce2',18,18,0,0],['bounce3',12,12,0,0],
  ['rocket',16,16,0,0],['pu_rocket',20,20,1,0],['pu_line',20,20,1,0],['pu_shield',20,20,1,0],['pu_spread',20,20,1,0],
  ['pu_laser',20,20,1,0],['pu_bounce',20,20,1,0],['pu_oneup',20,20,1,0],['bullet',8,8,1,0],['walkershot',24,24,1,0],
  ['bullspread',18,13,1,1],['chaseshot',32,14,1,1],['mine',24,24,1,1],['elevatorshot',32,8,1,1],['spike1',16,17,1,1],
  ['spike2',16,17,1,1],['powerline',16,31,1,1],['volcanoball',16,16,1,1]];
const ESHOT_TYPE={blob:6,bullet:19,walkershot:20,bullspread:21,chaseshot:22,mine:23,elevatorshot:24,spike1:25,spike2:26,powerline:27,volcanoball:28};
// x, y = playfield position; rl/rr/rb = source rectangle (left, right, bottom; the top is always 0). The ship-shot
// collision uses rr and rb as width and height, which makes frames further right hit wider (as in the original).
function shotNew(x,y,vx,vy,type,frame=0,dmg=0,b22=0){const T=SHOT_T[type],fw=T[1];
  const s={type,x,y,vx,vy,dmg,b22,spr:T[0],fw,rl:T[4]?frame*fw:0,rr:T[4]?frame*fw+fw:fw,rb:T[2],own:T[3],act:true,
    t10:0,off:0,tgt:null,tr:0,lf:0,lv:0,g60:0,carrier:null,draw:null};
  G.shots.push(s);return s;}
function eshot(x,y,vx,vy,spr,opt={}){return shotNew(x,y,vx,vy,ESHOT_TYPE[spr],opt.frame||0,10);}

// ---------- weapons (player update 0x41ced0)
// every value below is read from Takatis.exe; frame counts assume the original 75 fps
const LASER_CD=[24,18,12,6],LASER_DMG=[5,4,3,3];
function fireSpread(){const lv=P.lvl[0],sp=(dx,vx,vy,fr)=>shotNew(P.x+dx,P.y+20,vx,vy,0,fr,3);
  sp(35,8,0,0);
  if(lv>=2){const dx=lv===4?47:45;sp(dx,7,-1,1);sp(dx,7,1,2);}
  if(lv>=3){sp(50,6,-2,3);sp(50,6,2,4);}
  if(lv>=4){sp(53,5,-3,5);sp(53,5,3,6);}
  sfx('spread');P.cool=20;}
function fireLaser(){const lv=P.lvl[1];   // two shots, each on its own half of the sine wave
  for(const v of [0,1])shotNew(P.x+38,P.y+21,5,0,7,0,LASER_DMG[lv-1],v);
  sfx('laser');P.cool=LASER_CD[lv-1];}
const F32=Math.fround,F02=Math.fround(0.2);
// laser (0x40fea0): smoke every 5 frames, then the sine offset in float32 arithmetic exactly as in the original
function laserStep(s){const sg=s.b22?-1:1;
  if(s.tr===0&&s.act){particle(s.x,s.y+s.off,4);s.tr=5;}s.tr--;
  if(s.off*sg>=30){s.lf=0;s.lv=-s.lv;}if(s.off*sg<=0){s.lf=1;s.lv=1;}
  s.off+=(s.lf?2:-2)*sg;s.lv=F32(s.lv-F02);s.off+=Math.trunc(s.lv)*sg;}
function fireBounce(){const lv=P.lvl[2];
  shotNew(P.x+40,P.y+17,9,0,8,0,4);
  if(lv===4){shotNew(P.x+40,P.y+17,8,-3,10,0,3);shotNew(P.x+40,P.y+17,8,3,10,0,3);}
  sfx('bounce');P.cool=lv<4?30:20;}
function fireRocket(){P.rockets--;const s=shotNew(P.x+30,P.y+20,6,0,11,0,100);s.rl=32;s.rr=48;sfx('rocket');}
function fireLine(){P.lines--;for(let y=0;y<=384;y+=32)shotNew(P.x+50,y,15,0,5,0,8);   // 13 segments over the whole height
  sfx('powerline');}
function releaseBeam(){const c=P.beam;P.beam=0;   // charge 0..248; exactly 110 and 180 fire nothing, as in the original
  const lv=c>40&&c<110?1:c>110&&c<180?2:c>180&&c<248?3:c===248?4:0;if(!lv)return;
  const B=[[34,25,10],[35,20,15],[35,16,20],[35,11,25]][lv-1];
  shotNew(P.x+B[0],P.y+B[1],8,0,lv,0,B[2]);sfx('beam');}
// bounce balls hitting an enemy or the boss (0x41efa4, 0x41e6ab): the big ball splits into two medium ones going back
// (not at stage 1), a medium ball moving left splits into two small ones depending on the face it hit (not at stage 2).
// b = the box that was hit.
function bounceSplit(s,b){const lv=P.lvl[2];
  if(s.type===8&&lv!==1)for(const vy of [9,-9])shotNew(s.x-9,s.y,-9,vy,9,0,5);
  if(s.type===9&&lv!==2&&s.vx<0){const right=b.x+b.w-s.x;let q;
    if(s.vy<0)q=b.y+b.h-s.y<=right?[[0,9,-9,9],[0,9,9,9]]:[[9,0,9,-9],[9,0,9,9]];
    else if(s.vy>0)q=s.rb-(b.y-s.y)<=right?[[0,-9,-9,-9],[0,-9,9,-9]]:[[9,0,9,-9],[9,0,9,9]];
    if(q)for(const [dx,dy,vx,vy] of q)shotNew(s.x+dx,s.y+dy,vx,vy,10,0,5);}}
// bounce balls hitting a wall (0x42c52c): big and medium balls split as above; a small ball (and a medium one at
// stage 2) reflects off the face it hit and dies in a corner. Returns true when the ball survives.
function bounceWall(s,b){const lv=P.lvl[2];
  if(s.type===8||(s.type===9&&lv!==2)){bounceSplit(s,b);return false;}
  let n=0,fa=false,fb=false;const right=b.x+b.w-1-s.x,left=s.fw-(b.x-s.x),below=b.y+b.h-1-s.y,above=s.rb-(b.y-s.y);
  if(s.vx<0&&s.vy<0){if(below<=right){s.vy=-s.vy;s.y+=11;fa=true;}else{s.vx=-s.vx;s.x+=11;}n++;}
  if(s.vx<0&&s.vy>0&&!fa){if(above<=right){s.vy=-s.vy;s.y-=11;}else{s.vx=-s.vx;s.x+=11;}n++;}
  if(s.vx>0&&s.vy<0){if(b.y+b.h-s.y<=left){s.vy=-s.vy;s.y+=11;fb=true;}else{s.vx=-s.vx;s.x-=11;}n++;}
  if(s.vx>0&&s.vy>0&&!fb){if(above<=left){s.vy=-s.vy;s.y-=11;}else{s.vx=-s.vx;s.x-=11;}n++;}
  return n<2;}
// rocket (0x41014e): smoke every 2 frames; without a target it flies straight and searches: every enemy that is
// neither targeted yet nor of type 0, 39 or 18..21 gets marked and the last one becomes the target, otherwise the
// last enemy that is not 0 or 39. It steers 6 px per axis, 1 px when closer than 6, and loses a target that is gone.
const ROCKET_FR=(vx,vy)=>vy<0?(vx>0?1:vx<0?7:0):vy>0?(vx>0?3:vx<0?5:4):(vx>0?2:vx<0?6:-1);
function rocketStep(s){
  if(s.tr===0&&s.act){particle(s.x,s.y+R(10)-5,3);s.tr=2;}s.tr--;
  if(!s.tgt){s.vx=6;s.vy=0;
    for(const e of G.enemies)if(!e.dead&&!e.rtarget&&e.type!==0&&e.type!==39&&!(e.type>=18&&e.type<=21)){e.rtarget=true;s.tgt=e;}
    if(!s.tgt)for(const e of G.enemies)if(!e.dead&&e.type!==39&&e.type!==0){e.rtarget=true;s.tgt=e;}}
  if(s.tgt&&!s.tgt.dead){const ax=d=>d>=6?6:d>0?1:d<=-6?-6:d<0?-1:0;s.vx=ax(s.tgt.x-s.x);s.vy=ax(s.tgt.y-s.y);}else s.tgt=null;
  const fr=ROCKET_FR(s.vx,s.vy);if(fr>=0){s.rl=fr*16;s.rr=fr*16+16;}}
// update and draw of one shot (0x40fe10): the shot is drawn at its old position (for the laser including the wave
// offset), then moved; the pixel tests of the collisions use that drawn position. Enemy shots and items drift with
// (speed-1); an item stays on its claw (+8/+42) and drifts 1 px per frame more once the claw is gone.
let VOLCANO_SAFE=false;   // 0x493ffc: set by nothing in the game, volcano balls stay dangerous
function shotStep(s){
  if(s.type===28&&s.g60===16){s.vy++;s.g60=0;}s.g60++;
  if(s.type===7)laserStep(s);
  if(s.type===28){if(s.tr===0&&s.act){particle(s.x+R(4)-2,s.y+R(4)-2,3);s.tr=3;}s.tr--;if(VOLCANO_SAFE)s.own=0;}
  if(s.type===11)rocketStep(s);
  s.draw=null;
  if(s.act){if(s.x>W+s.fw||s.y+s.rb<0||s.y>PH+1||s.x+s.fw<0)s.act=false;   // leaves the playfield (drawn a last time)
    let x=s.x,y=s.y+s.off,rl=s.rl,rr=s.rr,rb=s.rb,rt=0;   // clipped to the playfield like BltFast needs it
    if(x<0){rl-=x;x=0;}if(x+s.fw>W)rr-=x+s.fw-W;if(y<0){rt=-y;y=0;}if(y+s.rb>PH+1)rb=PH+1-y;
    if(rr>rl&&rb>rt)s.draw={x,y,sx:rl,sy:rt,w:rr-rl,h:rb-rt};}
  if(s.own)s.x-=G.speed-1;
  if(s.type>=12&&s.type<=18&&s.carrier){if(!s.carrier.dead){s.x=s.carrier.x+8;s.y=s.carrier.y+42;}else s.x-=1;}
  else{s.x+=s.vx;s.y+=s.vy;}
  if(s.type>=1&&s.type<=4){   // beams: two frames alternating every 6 frames, shield flares behind them
    if(++s.t10===6){if(s.rr===s.fw){s.rl=s.fw;s.rr=2*s.fw;}else{s.rl=0;s.rr=s.fw;}s.t10=0;}
    const on=s.t10%3!==0&&s.act;
    if(s.type===1&&on)particle(s.x,s.y-3,5);
    if(s.type===2&&on)particle(s.x,s.y+1,5);
    if(s.type===3){const d=R(6)-3;if(on)particle(s.x,s.y+d-1,5);particle(s.x,s.y+d+9,5);}
    if(s.type===4){const d=R(8)-4;if(on){particle(s.x+d+8,s.y+d+1,5);particle(s.x+d+8,s.y+d+16,5);particle(s.x+d,s.y+d+9,5);}}}
  if(s.type===23&&++s.t10===12){if(s.rr===s.fw){s.rl=s.fw;s.rr=2*s.fw;}else{s.rl=0;s.rr=s.fw;}s.t10=0;}}   // mines blink
// list update (0x410f30): newest shot first; switched-off shots leave the list
function shotsStep(){const n=G.shots.length;for(let i=n-1;i>=0;i--){const s=G.shots[i];if(s.act)shotStep(s);else s.draw=null;}
  G.shots=G.shots.filter(s=>s.act||s.draw);}
function shotsDraw(){for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i],d=s.draw;if(d)ctx.drawImage(S[s.spr].img,d.sx,d.sy,d.w,d.h,d.x,d.y,d.w,d.h);}}
// the shape a shot was drawn with, for the pixel tests
const shotShape=s=>{const d=s.draw;return d?{img:S[s.spr].img,sx:d.sx,sy:d.sy,w:d.w,h:d.h,x:d.x,y:d.y}:null;};
// ---------- pickups (0x41eace): no weapon switch, fixed points per item
function pickup(type){
  if(type===12){if(P.rockets<16)P.rockets++;G.score+=100;sfx('v_homing');}
  else if(type===13){if(P.lines<16)P.lines++;G.score+=200;sfx('v_line');}
  else if(type===14){P.shieldOn=true;P.shieldT=0;G.score+=500;sfx('v_shield');}
  else if(type>=15&&type<=17){const i=type-15;G.score+=1000;sfx(['v_spread','v_laser','v_bounce'][i]);if(P.lvl[i]<4)P.lvl[i]++;}
  else if(type===18){G.score+=2500;sfx('v_oneup');G.lives++;}}

// ---------- damage: 3 energy, death below 0; enemy shot -1, ramming -2; no invulnerability frames
function killPlayer(){if(!P.dead)P.dead=400;}   // the death sequence starts with the next frame (0x41c95b)
// destroyed enemy (ramming 0x40bd13, shot 0x41f247, wall 0x42cb59): 5 staggered explosions and debris
function enemyBlast(e,debris,dy=0){explode5(e.x,e.y,0);for(let k=0;k<debris;k++)particle(e.x,e.y+dy,0);}
// a ship shot hits enemy e (0x41ef05): energy, then either the destruction with points, drops and 25 debris or 1-4
// sparks with a hit sound each; the powerline and the biggest beam (except against type 0) fly on
function shotHitsEnemy(s,e){e.hp-=s.dmg;
  if(e.type===23){const dx=R(10)-5,dy=R(10)-5;for(let k=0;k<7;k++)particle(s.x+dx,s.y+dy,5);s.act=false;}
  if(s.type===8||s.type===9)bounceSplit(s,e);
  if(e.hp<=0){const small=e.type>=18&&e.type<=21;
    for(let i=0;i<25;i+=5){const dx=R(21)-10,dy=R(51)-25;   // the points are added once per step (0x41f45f)
      if(small){explosion(e.x+dx,e.y+dy,i,2);sfx('hit');}else explosion(e.x+dx,e.y+dy,i,0);
      if(e.type===28)for(const [vx,vy,t] of [[-3,-3,25],[3,3,25],[3,-3,26],[-3,3,26]])shotNew(e.x+28,e.y+28,vx,vy,t,0,10);
      G.score+=e.score;}
    if(!small)for(let k=0;k<25;k++)particle(e.x,e.y,0);
    if(e.type===6){shotNew(e.x+10,e.y+10,-1,0,12);shotNew(e.x-10,e.y+25,-1,0,12);shotNew(e.x+30,e.y+25,-1,0,12);}   // extra load of the claws
    if(e.type===7)shotNew(e.x+10,e.y+10,-1,0,13);
    if(!(e.type>=3&&e.type<=9)&&!small){const r=R(3500);if(r<=20)shotNew(e.x,e.y,-1,0,14);else if(r<=100)shotNew(e.x,e.y,-1,0,12);else if(r<=140)shotNew(e.x,e.y,-1,0,13);}
    e.dead=true;}
  else if(e.type!==23){const n=R(4)+1;for(let k=0;k<n;k++){if(e.type===0)particle(e.x-25,e.y-25,2);else particle(e.x-25,s.y-25,1);sfx('hit');}}
  if(!(s.type===5||(s.type===4&&e.type!==0)))s.act=false;
  if(s.type===4)explosion(s.x,s.y,0,1);}

// ---------- ship (0x41ced0)
// the ship can only be steered while the level runs (0x49645c = 0) or a boss is there (0x496704)
const steerable=()=>G.endPhase===0||G.bossActive;
function updatePlayer(){
  if(P.dead){deathStep();return;}
  const u=K.up(),d=K.down(),l=K.left(),r=K.right(),ok=steerable();
  if(!u&&!d)P.bank-=Math.sign(P.bank);
  if((u&&d)||(l&&r))P.bank-=Math.sign(P.bank);   // opposite keys cancel all movement
  else if(ok){const v=P.spd||3;if(u){P.bank=Math.min(10,P.bank+1);P.y=Math.max(1,P.y-v);}if(d){P.bank=Math.max(-10,P.bank-1);P.y=Math.min(382,P.y+v);}
    if(l)P.x=Math.max(0,P.x-v);if(r)P.x=Math.min(591,P.x+v);}
  // engine exhaust (0x41d106): two particles per frame
  for(let k=0;k<2;k++)particle(P.x-37,P.y+R(10)-20,8);
  // weapons, not while a boss explodes (0x41d162)
  if(!bossFlag()){
    const fire=K.fire()&&ok,ctrl=K.beam()&&ok,L=P.latch;
    if(ctrl&&!fire)P.beam=Math.min(248,P.beam+2);else releaseBeam();   // releasing Ctrl or pressing fire lets the beam go
    if(!fire){L.fire=false;L.bounce=false;}
    if(fire&&P.weapon===0&&!L.fire){L.fire=true;fireSpread();}                     // spread: one shot per key press, no cooldown
    if(fire&&P.weapon===1&&P.lvl[1]>0&&P.cool===0)fireLaser();                     // laser: the only autofire weapon
    if(fire&&P.weapon===2&&P.lvl[2]>0&&!L.bounce){L.bounce=true;fireBounce();}     // bounce: one ball per key press
    const ent=(keys.Enter||keys.NumpadEnter)&&ok,sh=(keys.ShiftLeft||keys.ShiftRight)&&ok;
    if(ent&&P.lines>0&&!L.line)fireLine();L.line=ent;
    if(sh&&P.rockets>0&&!L.rocket)fireRocket();L.rocket=sh;
    // weapon select: 1 spread, 2 bounce, 3 laser, numpad 0 cycles; the voice repeats at most every 50 frames

      text(String(sv.rockets),375,y,0);text(String(sv.lines),420,y,0);text(['Easy','Norm','Hard'][sv.diff],455,y,[2,4,1][sv.diff]);
      text(String(sv.score),500,y,0);}
    text(String(i+1),120,y,0);}
  ctx.drawImage(S.star.img,48,0,24,24,90,194+G.saveSel*25,24,24);}
// ---------- the end (state 10, 0x42a250): Endscreen.gfx behind the enemy parade of Level/ot.lvl (its foreground tiles
// are the letters of bigfont.gfx), scrolling 1 px per frame and starting over after 13200; below it the text at
// 0x4766d8 in row 6 of the font, every screen column moved by a sine wave whose size swings between -5 and 0.3
// (F7/F8 change it); the walker bobs on the left; the edges are faded by fadeleft/faderight. Escape ends the game.
const END={cv:null,txt:0,px:10,sub:2,amp:0,up:false,cnt:0,ys:new Int16Array(640),off:0,buf:'',bufPx:10};
function endStart(){G.state='end';G.level=12;const l=level();   // level 0xff: ot.lvl, the ship back at (10,200)
  G.scroll=0;G.speed=l.speed;G.maxScroll=l.wb*32-640;G.enemies=[];G.shots=[];PART=[];EXPL=[];G.next=0;
  G.bossActive=false;BOSS.phase=null;G.endPhase=0;G.gamma=100;sfxStop('shield');P.x=10;P.y=184;
  if(!END.cv){END.cv=document.createElement('canvas');END.cv.width=800;END.cv.height=16;}
  Object.assign(END,{txt:0,px:10,sub:2,amp:0,up:false,cnt:0});musicPlay('end');}
function endStep(){
  if(pressed.Escape){G.state='gameover';G.timer=240;musicPlay('highscore');return;}
  G.scroll++;updateEnemies();tilePass();G.enemies=G.enemies.filter(e=>!e.dead);shotsStep();partStep();explStep();
  if(G.scroll>13200)G.scroll=0;
  const txt=DATA.outro.text;END.buf=txt.substr(END.txt,70);END.bufPx=END.px;
  if(END.sub===0){END.px--;END.sub=1;}END.sub--;
  if(END.px<0){const c=txt.charCodeAt(END.txt)||0;END.px=FW[c]||10;if(++END.txt>1040)END.txt=0;}
  const f=Math.fround,A=()=>END.amp;
  if(keys.F7)END.amp=f(A()-f(0.1));if(keys.F8)END.amp=f(A()+f(0.1));
  if(!END.up)END.amp=f(A()-f(0.05));else END.amp=f(A()+f(0.08));
  if(A()<-5){END.up=true;END.amp=-5;}if(A()>f(0.3)){END.up=false;END.amp=f(0.3);}
  let ph=0;for(let x=0;x<W;x++){END.ys[x]=Math.trunc(Math.sin(f(0.005)*A()*x+ph)*-5*A()*-1);ph=f(ph+f(0.01));if(ph>=10)ph=0;}
  END.off=Math.trunc(Math.sin(END.cnt*f(0.0363)+ph)*45);if(++END.cnt===300000)END.cnt=0;}
function drawEnd(){const l=level();ctx.drawImage(S.endscreen.img,0,0);
  ctx.save();ctx.translate(0,PY);
  const drawEnemy=e=>{if(e.spr)frame(e.spr,e.f,e.x+(e.type===17?G.shake:0),e.y,e.dir<0);};
  for(const e of G.enemies)if(e.type!==26&&e.type!==27)drawEnemy(e);
  drawLayer(l.B,l.wb,S.bigfont.img,Math.floor(G.scroll));
  for(const e of G.enemies)if(e.type===26||e.type===27)drawEnemy(e);
  shotsDraw();partDraw();explDraw();ctx.restore();
  const g=END.cv.getContext('2d'),keep=ctx;g.clearRect(0,0,800,16);ctx=g;try{text(END.buf,END.bufPx,0,6);}finally{ctx=keep;}
  for(let x=0;x<W;x++)ctx.drawImage(END.cv,x,0,1,16,x,END.ys[x]+150,1,16);
  const o=END.off,sx=o>24&&o<50?0:o>0&&o<25?43:86;ctx.drawImage(S.e12.img,sx,0,43,54,130,o+57,43,54);
  ctx.drawImage(S.fadeleft.img,0,0);ctx.drawImage(S.faderight.img,520,0);}

// ---------- render
function drawLayer(map,w,ts,ox){const c0=Math.max(0,Math.floor(ox/32)),c1=Math.min(w-1,Math.floor((ox+W)/32));
  for(let r=0;r<13;r++)for(let c=c0;c<=c1;c++){const t=map[r*w+c];if(!t)continue;ctx.drawImage(ts,(t%10)*32,Math.floor(t/10)*32,32,32,c*32-ox,r*32,32,32);}}
function drawPlayfield(){const l=level(),th=T[l.theme];
  ctx.save();ctx.beginPath();ctx.rect(0,PY,W,PH);ctx.clip();ctx.translate(0,PY);
  ctx.drawImage(th.stc,0,0);
  drawLayer(l.A,l.wa,th.tsb,Math.floor(G.scroll/2));
  // draw order of 0x42bdb0: enemies behind the foreground tiles, presses in front of them
  const drawEnemy=e=>{if(e.spr)frame(e.spr,e.f,e.x+(e.type===17?G.shake:0),e.y+(e.off||0),e.dir<0);};
  for(const e of G.enemies)if(e.type!==26&&e.type!==27)drawEnemy(e);
  if(G.bossActive&&G.level===3)bossDraw();
  drawLayer(l.B,l.wb,th.tsa,Math.floor(G.scroll));
  for(const e of G.enemies)if(e.type===26||e.type===27)drawEnemy(e);
  if(G.bossActive&&G.level!==3)bossDraw();
  // then, as in 0x41c820: the ship with its shield, the explosions, the particles and the shot list. Ship and shield
  // are blitted without clipper and vanish once they touch the right edge.
  if(!P.dead){for(const d of P.shieldDraw)if(!d.front&&P.x+56<=W)frame('shield',d.f,P.x,P.y);
    if(P.x+49<=W)frame('player',playerFrame(),P.x,P.y);
    for(const d of P.shieldDraw)if(d.front&&P.x+56<=W)frame('shield',d.f,P.x,P.y);}
  explDraw();partDraw();shotsDraw();
  ctx.restore();}
function drawHUD(){const hb=S.hudbottom;ctx.drawImage(S.hudtop.img,0,0);ctx.drawImage(hb.img,0,H-48);
  // weapon stages (0x41c34c): one ws.gfx block per stage, 7 px apart; spread x=122, bounce x=222, laser x=322
  for(const [x,n] of [[122,P.lvl[0]],[222,P.lvl[2]],[322,P.lvl[1]]])for(let i=0;i<n;i++)ctx.drawImage(S.ws.img,x+i*7,3);
  num(P.rockets,422+String(P.rockets).length*4,3);num(P.lines,522+String(P.lines).length*4,3);
  num(G.lives,98,457);num(level().stage,160,457);num(G.score,514,457);
  for(let i=0;i<3;i++){if(i<P.energy)frame('energy',0,196+i*96,439);}
  if(P.beam>0){const s=S.beamload;const wdt=P.beam;ctx.drawImage(s.img,0,0,wdt,24,197,452,wdt,24);}
  bossHUD();
  if(G.info){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,PY,250,110);const rows=['Scrollposition: '+Math.round(G.scroll),'Scrollspeed   : '+G.speed,'Anzahl Enemys : '+G.enemies.filter(e=>!e.trigger).length,'Anzahl Shots  : '+G.shots.length,'Anzahl Expl.  : '+EXPL.length,'Next Object   : '+G.next+'/'+level().objects.length];rows.forEach((r,i)=>text(r,4,PY+4+i*17,3));}}
function drawCenter(str,y,row=0){text(str,W/2,y,row,1);}
const HELP=[['STEUERUNG','CURSOR / NUMPAD  BEWEGEN','SPACE  PRIMAERWAFFE','STRG  BEAM AUFLADEN','SHIFT  RAKETE','RETURN  POWERLINE','1 2 3  WAFFE WAEHLEN','P  PAUSE   ESC  MENUE'],
 ['PRIMAERWAFFEN','SPREAD SHOT  4 STUFEN','  BREITER STREUWINKEL','LASER  4 STUFEN','  DAUERFEUER, SCHNELL','BOUNCE  4 STUFEN','  TEILT SICH AN WAENDEN'],
 ['SEKUNDAERWAFFEN','BEAM  4 LADESTUFEN','RAKETE  ZIELSUCHEND','POWERLINE  KRAFTFELD','SCHILD  KURZ UNVERWUNDBAR','ONE UP  EXTRALEBEN'],
 ['CONTAINER','TRAEGER TRAGEN EXTRAS','ABSCHIESSEN GIBT MEHR','ALS DAS EINSAMMELN','','SPEED TRIGGER AENDERN','DIE SCROLLGESCHWINDIGKEIT'],
 ['DIE STORY','DU SITZT AM STEUERKNUEPPEL','EINES RAUMGLEITERS UND','FLIEGST DURCH EINE WELT','VOLLER FINSTERER GESTALTEN','','LETS BLAST THESE ALIENS']];
const CREDITS=['TAKATIS','A TRIBUTE TO MANFRED TRENZ','','PROGRAMMIERUNG','HEIKO KALISTA','','GRAFIK MUSIK LEVELDESIGN','JOERG M WINTERSTEIN','','3D MODELLE','MICHAEL MATZKA','','VOICES','ALEXANDRA HERTSTEIN','SEB KUGLER','','(C) 2002 POKE53280','','BROWSER REMAKE','AUS DEN ORIGINALDATEN'];
function drawMenus(){
  if(G.state==='menu'){const bw=224,bh=64;panel(W/2-bw/2-16,28,bw+32,bh*MENU_ITEMS.length+24);
    for(let i=0;i<MENU_ITEMS.length;i++)ctx.drawImage(S.menu.img,(i===G.menuSel?0:224),i*64,224,64,W/2-bw/2,40+i*64,224,64);
    return;}
  if(G.state==='start'){panel(60,60,520,340);
    drawCenter('START GAME',78,0);
    drawCenter('START A NEW GAME',110,1);
    const dn=['EASY','NORMAL','HARD'],dc=[2,4,1];   // green / yellow / red as in the original
    for(let i=0;i<3;i++)text(dn[i],150+i*130,134,dc[i],1);
    if(G.startRow===0){const cx=150+G.diff*130,hw=dn[G.diff].length*5;   // markers bracket the chosen skill
      text('>',cx-hw-12,134,dc[G.diff],1);text('<',cx+hw+12,134,dc[G.diff],1);}
    drawCenter('CONTINUE A SAVED GAME',166,1);
    text('SLOT  STAGE LIVES  WEAPONS   SKILL  SCORE',300,190,3,1);
    for(let i=0;i<SLOTS;i++){const sv=readSlot(i);const y=212+i*28;const sel=G.startRow===i+1;
      if(sel){ctx.fillStyle='rgba(160,120,40,.25)';ctx.fillRect(70,y-3,500,24);}
      text(String(i+1),90,y,sel?2:3,1);
      if(!sv)text('-- EMPTY SLOT --',300,y,sel?2:3,1);
      else{text(LEVELS[sv.level].stage,160,y,sel?2:3,1);text(String(sv.lives),225,y,sel?2:3,1);
        for(let w=0;w<3;w++)text(String(sv.lvl[w]),275+w*26,y,sel?2:3,1);
        text(dn[sv.diff],420,y,[2,4,1][sv.diff],1);text(String(sv.score),520,y,sel?2:3,1);}}
    return;}
  if(G.state==='options'){panel(120,120,400,220);drawCenter('OPTIONS',140,0);
    const rows=[['MUSIK',Math.round(MUSIC.vol*10)],['SOUND',Math.round((G.sfxVol===undefined?1:G.sfxVol)*10)],['SKILL',['EASY','NORMAL','HARD'][G.diff]]];
    rows.forEach((r,i)=>{const y=190+i*40;text(r[0],200,y,G.optSel===i?0:3,1);text(String(r[1]),380,y,i===2?[2,4,1][G.diff]:(G.optSel===i?0:3),1);});
    drawCenter('ESC  ZURUECK',310,3);return;}
  if(G.state==='help'){panel(60,60,520,340);const pg=HELP[G.page];
    drawCenter(pg[0],86,0);
    for(let i=1;i<pg.length;i++)text(pg[i],90,124+(i-1)*28,i===1?2:3);
    drawCenter('SEITE '+(G.page+1)+'/'+HELP.length+'   CURSOR BLAETTERN   ESC',368,3);return;}
  if(G.state==='hiscore'){panel(140,100,360,260);drawCenter('HIGHSCORE',124,0);
    drawCenter(String(G.hiscore),180,2);drawCenter('LETZTES SPIEL',230,3);drawCenter(String(G.score),260,3);
    drawCenter('ESC  ZURUECK',330,3);return;}
  if(G.state==='credits'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    CREDITS.forEach((l,i)=>{const y=G.creditY+i*20;if(y>-20&&y<H)text(l,W/2,y,l===l.toUpperCase()&&i<2?0:3,1);});return;}}
function render(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(G.state==='title'){ctx.drawImage(S.title.img,0,0);ctx.drawImage(S.logo.img,0,10);if(Math.floor(G.frame/30)%2)drawCenter('PRESS ESC FOR MENU',320,2);drawCenter('HIGHSCORE '+G.hiscore,352,3);return;}
  if(G.state==='menu'||G.state==='start'||G.state==='options'||G.state==='help'||G.state==='hiscore'||G.state==='credits'){
    ctx.drawImage(S.title.img,0,0);drawMenus();return;}
  if(G.state==='end'){drawEnd();return;}
  if(G.state==='fadeout')ctx.drawImage(G.fade.img,0,0);
  else if(G.state==='ready'){   // intro (0x416301): black playfield, HUD, "Get ready" and the three lines of the stage
    drawHUD();frame('getready',0,160,180);for(const [y,s,c] of DATA.intro[G.level])drawCenter(s,y,c);}
  else{if(G.endPhase===2&&G.endT>=50&&WAVE.prev)ctx.drawImage(WAVE.prev,0,PY,W,PH,0,PY,W,PH);else drawPlayfield();drawHUD();}
  if(G.state==='save'){drawSave();return;}
  else if(G.state==='gameover'){frame('gameover',0,(W-429)/2,180);}
  else if(G.state==='pause'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,PY,W,PH);drawCenter('PAUSE',220,0);}
  else if(G.state==='quit'){const bx=150,by=190,bw=340,bh=110;
    ctx.fillStyle='rgba(20,10,6,.92)';ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle='#8a6a3a';ctx.lineWidth=2;ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    drawCenter('SPIEL BEENDEN ?',by+22,0);
    text('JA',bx+95,by+68,G.quitSel?1:0,1);text('NEIN',bx+245,by+68,G.quitSel?0:2,1);}
  if(G.gamma<100){ctx.fillStyle='rgba(0,0,0,'+(1-G.gamma/100)+')';ctx.fillRect(0,0,W,H);}}

// ---------- main loop
function step(){G.frame++;musicTick();if(G.state==='title'&&MUSIC.want!=='title')musicPlay('title');
  if(pressed.KeyM){muted=!muted;if(muted)for(const k in VOICE)sfxStop(k);}if(pressed.Minus||pressed.NumpadSubtract){MUSIC.vol=Math.max(0,MUSIC.vol-0.1);}if(pressed.Equal||pressed.NumpadAdd){MUSIC.vol=Math.min(1,MUSIC.vol+0.1);}
  if(pressed.F1)G.info=!G.info;
  switch(G.state){
    case 'menu':{
      if(pressed.ArrowUp)G.menuSel=(G.menuSel+MENU_ITEMS.length-1)%MENU_ITEMS.length;
      if(pressed.ArrowDown)G.menuSel=(G.menuSel+1)%MENU_ITEMS.length;
      if(pressed.Escape)G.state='title';
      if(pressed.Enter||pressed.Space){const it=MENU_ITEMS[G.menuSel];
        if(it==='start'){G.state='start';G.startRow=0;G.slotSel=0;}
        else if(it==='options'){G.state='options';G.optSel=0;}
        else if(it==='help'){G.state='help';G.page=0;}
        else if(it==='highscore')G.state='hiscore';
        else if(it==='credits'){G.state='credits';G.creditY=PH;}
        else if(it==='quit')G.state='title';}
      break;}
    case 'start':{
      if(pressed.ArrowUp)G.startRow=Math.max(0,G.startRow-1);
      if(pressed.ArrowDown)G.startRow=Math.min(SLOTS,G.startRow+1);
      if(G.startRow===0){if(pressed.ArrowLeft)G.diff=Math.max(0,G.diff-1);if(pressed.ArrowRight)G.diff=Math.min(2,G.diff+1);}
      if(pressed.Escape)G.state='menu';
      if(pressed.Enter||pressed.Space){
        if(G.startRow===0){G.lives=START_LIVES[G.diff];G.score=0;P=null;G.slot=null;startLevel(0);}
        else{const sv=readSlot(G.startRow-1);
          if(sv){G.diff=sv.diff;G.lives=sv.lives;G.score=sv.score;G.slot=G.startRow-1;P=newPlayer();P.lvl=sv.lvl.slice();P.weapon=sv.weapon;P.rockets=sv.rockets;P.lines=sv.lines;startLevel(sv.level);}
          else{G.lives=START_LIVES[G.diff];G.score=0;P=null;G.slot=G.startRow-1;startLevel(0);}}}
      break;}
    case 'options':{
      if(pressed.ArrowUp)G.optSel=(G.optSel+2)%3;if(pressed.ArrowDown)G.optSel=(G.optSel+1)%3;
      if(pressed.ArrowLeft||pressed.ArrowRight){const d=pressed.ArrowRight?1:-1;
        if(G.optSel===0)MUSIC.vol=Math.max(0,Math.min(1,MUSIC.vol+d*0.1));
        else if(G.optSel===1)G.sfxVol=Math.max(0,Math.min(1,(G.sfxVol===undefined?1:G.sfxVol)+d*0.1));
        else G.diff=Math.max(0,Math.min(2,G.diff+d));}
      if(pressed.Escape||pressed.Enter)G.state='menu';
      break;}
    case 'help':{
      if(pressed.ArrowDown||pressed.ArrowRight)G.page=Math.min(HELP.length-1,G.page+1);
      if(pressed.ArrowUp||pressed.ArrowLeft)G.page=Math.max(0,G.page-1);
      if(pressed.Escape||pressed.Enter)G.state='menu';
      break;}
    case 'hiscore':{if(pressed.Escape||pressed.Enter||pressed.Space)G.state='menu';break;}
    case 'credits':{G.creditY-=0.6;if(pressed.Escape||pressed.Enter||G.creditY<-CREDITS.length*18-40)G.state='menu';break;}
    case 'title':   // the title screen only waits; a game is always started from the menu
      if(pressed.Escape||pressed.Enter||pressed.Space){G.state='menu';G.menuSel=0;}break;
    case 'ready':{G.timer++;if(G.timer===1)sfx('v_online');   // then 100 gamma steps of 6 ms (0x4124f0) and 2 s (0x425bd0)
      const ms=(G.timer-1)*1000/FPS;G.gamma=ms<600?Math.floor(ms/6):100;if(ms>=2600){G.gamma=100;G.state='play';}break;}
    case 'fadeout':fadeStep();break;
    case 'save':saveStep();break;
    case 'play':if(pressed.Escape){G.state='quit';G.quitSel=0;break;}
    if(pressed.KeyP){G.state='pause';break;}if(pressed.F2){if(G.bossActive)V.w32(0x494050,0);else if(G.scroll<=G.maxScroll)G.scroll=G.maxScroll+1;}updatePlay();break;
    case 'pause':if(pressed.KeyP||pressed.Escape)G.state='play';break;
    case 'quit':
      if(pressed.ArrowLeft||pressed.ArrowRight||pressed.ArrowUp||pressed.ArrowDown)G.quitSel=G.quitSel?0:1;
      if(pressed.Escape)G.state='play';
      if(pressed.Enter||pressed.Space){if(G.quitSel){G.hiscore=Math.max(G.hiscore,G.score);try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}G.state='menu';G.menuSel=0;musicPlay('title');}else G.state='play';}
      break;
    case 'gameover':G.timer--;if(G.timer<=0||pressed.Enter){G.hiscore=Math.max(G.hiscore,G.score);try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}G.state='menu';G.menuSel=0;musicPlay('title');}break;
    case 'end':endStep();break;
  }
  pressed={};}
let acc=0,last=performance.now();
function loop(now){try{const dt=Math.min(100,now-last);last=now;acc+=dt;let n=0;while(acc>=1000/FPS&&n<4){step();acc-=1000/FPS;n++;}render();}catch(e){window.__lastErr=String(e)+' | '+(e.stack||'');console.error(e);}requestAnimationFrame(loop);}
loadAssets().then(()=>{msg.hidden=true;cv.focus();try{G.hiscore=+localStorage.getItem('takatis.hiscore')||0;}catch(e){}
  setInterval(()=>{try{localStorage.setItem('takatis.hiscore',G.hiscore);}catch(e){}},5000);requestAnimationFrame(loop);});
})();
</script>
